[project]
name = "stackscout"
version = "0.2.0"
description = "New tech, matched to your stack. A weekly tech radar on the web and Telegram."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot>=21.0,<23",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "fastapi>=0.163.2",
    "uvicorn>=0.30",
    "feedparser>=6.0.14",
    "anthropic>=2.10,<3",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:.*per_message:telegram.warnings.PTBUserWarning"]

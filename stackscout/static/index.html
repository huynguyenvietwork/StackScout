<style>
  :root, :root[data-theme="light"] {

    --shadow: none;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans CJK SC", "Noto Sans JP", "Noto Sans KR", sans-serif; }

  .topnav .tab[aria-current="page"] { background: var(--surface); color: var(--text); font-weight: 600; border-color: var(--border); }

  .sechead .note { margin-left: auto; font-size: 13px; color: var(--muted); }
  .hint { color: var(--muted); margin: 0 0 14px; font-size: 14px; }
  .kicker { margin: 0 0 6px; font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
  h1.page { margin: 0; font-size: 32px; line-height: 1.15; letter-spacing: -.02em; }
  .muted { color: var(--muted); }
  button { font: inherit; }
  .btn { font-weight: 600; font-size: 14px; padding: 11px 16px; border-radius: 12px; border: 1px solid var(--control); background: var(--surface); color: var(--text); cursor: pointer; }
  .btn.sm { font-size: 13px; padding: 9px 12px; border-radius: 10px; white-space: nowrap; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn.link { border-color: transparent; background: none; color: var(--muted); font-weight: 500; padding-left: 6px; padding-right: 6px; }
  .btn.link:hover { color: var(--text); }
  .btn.danger { color: var(--danger); border-color: var(--danger); }
  .btn:disabled { opacity: .55; cursor: default; }
  textarea, input[type=text] { width: 100%; font: inherit; color: var(--text); background: var(--input); border: 1px solid var(--control);
                               border-radius: 12px; padding: 12px 14px; resize: vertical; }
  textarea:focus, input:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
  .row .spacer { flex: 1; }
  .filters { display: flex; flex-direction: column; gap: 2px; }
  .filters button { font-size: 14px; text-align: left; padding: 11px 12px; border-radius: 10px; border: 0; background: none; color: var(--text);
                    display: flex; justify-content: space-between; gap: 8px; cursor: pointer; }
  .filters button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-strong); font-weight: 600; }
  .filters .count { font-size: 13px; color: var(--muted); }
  .filters button[aria-pressed="true"] .count { color: var(--accent-strong); }
  .sidelabel { margin: 0 0 8px 4px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 5px 10px; border-radius: 999px; background: var(--soft); border: 1px solid var(--border); }
  .chip .x { border: none; background: none; padding: 0 4px; color: var(--muted); font-size: 16px; line-height: 1; cursor: pointer; }
  .chip .x:hover { color: var(--danger); }
  .lvl { font-size: 11px; font-weight: 600; border-radius: 999px; padding: 1px 7px; background: var(--accent-soft); color: var(--accent-strong); }
  .lvl.advanced { background: var(--ok-bg); color: var(--ok-fg); }
  .lvl.beginner { background: var(--trial-bg); color: var(--trial-fg); }
  .tag { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--soft); color: var(--muted); border: 1px solid var(--border); }
  .tag.official { background: var(--ok-bg); color: var(--ok-fg); border-color: transparent; font-weight: 600; }
  article.item { padding: 16px 0; border-top: 1px solid var(--divider); display: flex; flex-direction: column; gap: 12px; }
  article.item:first-of-type { border-top: 0; padding-top: 4px; }
  .itemrow { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; }
  .itemmain { flex: 1 1 340px; min-width: 0; }
  .itemtitle { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .itemtitle strong { font-size: 16px; }
  .itemtext { margin: 4px 0 0; color: var(--body); font-size: 15px; }
  .result { background: var(--soft); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }
  .result p { margin: 0; font-size: 14px; }
  .resulthead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .rec { margin-left: auto; font-size: 13px; font-weight: 700; padding: 6px 12px; border-radius: 999px; }

  .rec.watch, .rec.insufficient { background: var(--watch-bg); color: var(--watch-fg); } .rec.ignore { background: var(--ignore-bg); color: var(--ignore-fg); }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 640px) { .grid2, .grid3 { grid-template-columns: 1fr; } h1.page { font-size: 26px; } .card { padding: 18px; } }
  .colhead { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  .pro { color: var(--pro); } .con { color: var(--con); }
  .refs a { font-size: 12px; margin-left: 2px; text-decoration: none; }
  .mini { border: 1px solid var(--divider); border-radius: 12px; padding: 14px; }
  .mini p { margin: 6px 0 0; font-size: 14px; color: var(--body); }
  .chip.off { opacity: .5; }
  .demobar { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; justify-content: center; padding: 10px 16px;

  .demobar a { color: var(--link); }
  .ovgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  @media (max-width: 900px) { .ovgrid { grid-template-columns: minmax(0, 1fr); } }
  .ovcard { display: flex; flex-direction: column; margin: 0; }
  .ovcard .sechead { flex-wrap: nowrap; align-items: flex-start; }
  .ovcard .sechead h2 { font-size: 17px; flex: 1; min-width: 0; padding-top: 5px; }
  .ovcard .sechead .note { padding-top: 7px; }
  .ovcard .sechead .note { font-weight: 600; }
  .ovlist { list-style: none; margin: 0 0 12px; padding: 0; flex: 1; }
  .ovlist li { padding: 8px 0; border-top: 1px solid var(--divider); font-size: 14px; line-height: 1.45; color: var(--text); overflow-wrap: anywhere; }
  .ovlist li:first-child { border-top: 0; }
  .ovlist li.more { color: var(--muted); }
  .ovcard > .btn { align-self: flex-start; }
  .theme { padding: 12px 0; border-top: 1px solid var(--divider); }
  .theme:first-of-type { border-top: 0; }
  .theme p { margin: 4px 0 0; font-size: 14px; color: var(--body); }
  .group { display: grid; grid-template-columns: 170px 1fr; gap: 6px 14px; padding: 8px 0; border-top: 1px solid var(--divider); }
  .group:first-of-type { border-top: 0; }
  .group .label { color: var(--muted); font-size: 14px; padding-top: 5px; }
  @media (max-width: 560px) { .group { grid-template-columns: 1fr; } }
  .src { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--divider); }
  .src:first-of-type { border-top: 0; }
  .src .info { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .src .info small { flex-basis: 100%; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .src.off .info { opacity: .55; }
  .src input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); cursor: pointer; flex: none; }
  .progress { height: 4px; background: var(--divider); border-radius: 4px; margin-bottom: 20px; overflow: hidden; }
  .progress > div { height: 100%; background: var(--accent); transition: width .25s; }
  .callout { background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; margin-bottom: 16px; color: var(--text); }
  .loading { display: flex; align-items: center; gap: 12px; color: var(--muted); padding: 8px 0; }
  .spinner { width: 16px; height: 16px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; flex: none; }

  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.5s; } }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px;

  .toast.error { background: var(--danger); color: #fff; }
  .toast button { padding: 4px 8px; background: transparent; color: inherit; border: 1px solid currentColor; border-radius: 8px; cursor: pointer; }

  .split { position: relative; display: inline-flex; flex: none; }

  .split > .solo { border-radius: 10px; border-left: 1px solid var(--control); padding: 9px 11px; }
  .menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; min-width: 230px; max-height: 300px; overflow: auto;

  .menu .menuhead { margin: 6px 10px 6px; font-size: 12px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
  .menu .menusearch { margin: 0 0 6px; padding: 9px 10px; font-size: 14px; border-radius: 8px; }

  .menu button:hover, .menu button:focus-visible { background: var(--accent-soft); outline: none; }
  .cmpline { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 12px; border-radius: 12px; background: var(--soft);

  button.cmpline { cursor: pointer; } button.cmpline:hover { border-color: var(--accent); }

  .cmpline.error { color: var(--danger); }
  .cmpline.queued { color: var(--muted); border-style: dashed; }
  .backdrop { position: fixed; inset: 0; background: rgba(8,10,14,.45); z-index: 30; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100%); background: var(--surface); border-left: 1px solid var(--border);

  .drawerhead { display: flex; align-items: flex-start; gap: 12px; }
  .drawerhead h2 { font-size: 22px; margin: 0; line-height: 1.25; }
  .verdict { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px 16px; border-radius: 14px; background: var(--soft); }
  .verdict .rec { margin-left: 0; font-size: 15px; padding: 8px 14px; }
  .fitbox { padding: 12px 14px; border-radius: 12px; background: var(--accent-soft); color: var(--text); font-size: 15px; margin: 0; }
  .dlist { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: var(--body); }
  .rival { border: 1px solid var(--divider); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
  .rival h4 { margin: 0; font-size: 16px; } .rival h4 .muted { font-weight: 500; font-size: 13px; margin-left: 6px; }
  .rival .side2 { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .rival h5 { margin: 0 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  .rival h5.pro { color: var(--success, #16a34a); } .rival h5.con { color: var(--danger); }
  .rival .fitbox { font-size: 14px; }
  .titlebtn { all: unset; cursor: pointer; font-weight: 700; font-size: 16px; color: var(--text); border-radius: 4px; }
  .titlebtn:hover { color: var(--link); text-decoration: underline; } .titlebtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ovlist li button { all: unset; cursor: pointer; } .ovlist li button:hover { color: var(--link); text-decoration: underline; }
  .ovlist li button:focus-visible { outline: 2px solid var(--accent); }
  .srcs { margin: 0; padding-left: 22px; font-size: 13px; line-height: 1.8; color: var(--muted); }
  .drawer h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; margin: 4px 0 0; font-weight: 700; }
</style>
</head>

class ApiError extends Error {}

// Demo build (docs/index.html): the page reads a static snapshot instead of a server.
const DEMO = window.SS_DEMO || null;

function demoApi(method, path, body) {
  const D = DEMO, p = path.split("?")[0];
  const routes = {
    "/api/meta": D.meta, "/api/profile": { profile: D.profile }, "/api/settings": { language: "en", chosen: false },
    "/api/radar/status": { running: false, step: "", error: null, week: D.report.week }, "/api/reports": { weeks: [D.report.week] },
    [`/api/reports/${D.report.week}`]: D.report, "/api/compare": { comparisons: D.comparisons }, "/api/market": { market: D.market },
    "/api/sources": D.sources, "/api/notify": { channels: ["email", "slack", "discord"], all: ["telegram", "email", "slack", "discord", "webhook"] },
  };
  if (method === "GET" && p in routes) return structuredClone(routes[p]);
  if (p === "/api/compare/auto") return { running: false, week: D.report.week, total: 0, done: 0, active: [], failed: {} };
  if (method === "PUT" && p === "/api/settings") return body;  // switching language works in the demo
  if (p === "/api/client-log") return {};
  throw new ApiError(t("demo.readonly"));
}

async function api(method, path, body) {
  if (DEMO) return demoApi(method, path, body);
  let res;
  try {
    res = await fetch(path, { method, headers: body ? { "Content-Type": "application/json" } : {},
                              body: body ? JSON.stringify(body) : undefined });
  } catch {
    throw new ApiError(t("err.network", { host: location.host }));
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    if (res.status === 502) throw new ApiError(t("err.ai"));
    const d = data.detail;
    const msg = typeof d === "string" ? d : Array.isArray(d) ? d.map(x => x.msg).join("; ") : t("err.generic");
    throw new ApiError(msg);
  }
  return data;
}

function reportError(message, detail = "") {
  console.error("[StackScout]", message, detail);
  if (DEMO) return;
  fetch("/api/client-log", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message: String(message).slice(0, 2000), detail: String(detail).slice(0, 8000) }) }).catch(() => {});
}
window.addEventListener("error", e => { reportError(e.message, e.error?.stack || ""); toast(t("err.page", { msg: e.message }), { error: true }); });
window.addEventListener("unhandledrejection", e => {
  const msg = e.reason?.message || String(e.reason);
  reportError(msg, e.reason?.stack); toast(t("err.page", { msg }), { error: true });
});

let toastTimer;
function toast(message, { error = false, action } = {}) {
  document.querySelector(".toast")?.remove();
  clearTimeout(toastTimer);
  const el = h("div", { class: "toast" + (error ? " error" : ""), role: "status" }, message,
    action && h("button", { onclick: () => { el.remove(); action.run(); } }, action.label));
  document.body.append(el);
  toastTimer = setTimeout(() => el.remove(), action ? 7000 : 4500);
}

async function run(label, fn) {
  state.busy = label; render();
  try { await fn(); }
  catch (e) { if (!(e instanceof ApiError)) reportError(e.message, e.stack); toast(e.message, { error: true }); }
  finally { state.busy = null; render(); }
}

function wizardView() {
  const q = QUESTIONS[state.step];
  const last = state.step === QUESTIONS.length - 1;
  const maxlength = q.key === "skills" || q.key === "project" ? 20000 : 4000;
  const box = h("textarea", { rows: q.key === "skills" ? 4 : 3, "aria-label": t(`q.${q.key}.title`), "data-autofocus": true, maxlength });
  box.value = state.answers[q.key];
  box.addEventListener("input", () => { state.answers[q.key] = box.value; });
  const next = () => {
    state.answers[q.key] = box.value.trim();
    if (q.required && !state.answers[q.key]) { toast(t("wiz.required")); box.focus(); return; }
    if (last) return makeDraft();
    state.step++; render();
  };
  onEnter(box, next);
  return h("div", { class: "card" },
    state.step === 0 && !state.profile && h("div", { class: "callout" }, t("wiz.intro")),
    h("div", { class: "progress" }, h("div", { style: `width:${(state.step + 1) * 25}%` })),

async function loadReports(week) {
  await run(null, async () => {

    const pick = week && weeks.includes(week) ? week : weeks[0];
    state.report = pick ? await api("GET", `/api/reports/${encodeURIComponent(pick)}`) : null;
    state.compares = {}; state.market = {};
    if (state.report) {
      const { comparisons } = await api("GET", `/api/compare?week=${encodeURIComponent(state.report.week)}`);
      mergeComparisons(comparisons);
      mergeMarket((await api("GET", `/api/market?week=${encodeURIComponent(state.report.week)}`)).market);
    }
  });

// Several cached comparisons for one item: show the one against its natural
// rival, unless the reader picked another tool with ⋯ (that one stays).
function mergeComparisons(comparisons) {
  const lists = sectionLists(state.report);
  const rivalsOf = Object.fromEntries([...lists.ai, ...lists.stack, ...lists.other, ...lists.new]
    .map(it => [nameKey(it.name), (it.rivals || []).map(nameKey)]));
  for (const [key, c] of Object.entries(comparisons)) {
    const [name, against] = key.split("|");
    const cur = state.compares[name];
    if (cur?.manual) continue;
    const isRival = (rivalsOf[name] || []).includes(against);
    if (!cur || cur.status !== "done" || isRival) state.compares[name] = { status: "done", data: c, against: c.current };
  }
}

function mergeMarket(market) {
  for (const [name, c] of Object.entries(market || {})) {
    if (state.market[name]?.status !== "done") state.market[name] = { status: "done", data: c };
  }
}

// ---- automatic comparisons ("So với stack" tab): the server compares every
// new technology with its natural rival in the background; the page polls.
async function ensureAuto() {
  if (!state.report) return;
  try { state.auto = await api("POST", "/api/compare/auto", { week: state.report.week }); } catch { return; }
  if (state.tab === "compare") render();
  if (state.auto.running) pollAuto();
}

function pollAuto() {
  clearTimeout(state.autoTimer);
  state.autoTimer = setTimeout(async () => {
    const week = state.report?.week;
    try {
      state.auto = await api("GET", "/api/compare/auto");
      if (week && state.auto.week === week) {
        mergeComparisons((await api("GET", `/api/compare?week=${encodeURIComponent(week)}`)).comparisons);
        mergeMarket((await api("GET", `/api/market?week=${encodeURIComponent(week)}`)).market);
      }
    } catch { /* keep polling */ }
    if (state.auto?.running) pollAuto();
    else if (state.auto?.total) toast(t("ctab.allDone", { n: state.auto.total - Object.keys(state.auto.failed || {}).length }));
    // Do not rebuild the page under an open menu (it would drop the search text); an open
    // drawer is rebuilt only when what it is waiting for has arrived.
    const waitingDrawer = state.drawer?.kind === "market" && state.market[nameKey(state.drawer.item.name)]?.status === "done"
      && !state.drawer.shownDone;
    if (waitingDrawer) state.drawer.shownDone = true;
    if (!state.menuOpen && (!state.drawer || waitingDrawer)) render();
  }, 5000);
}

  if (c.status === "error") return h("div", { class: "cmpline error", role: "alert" }, t("cmp.failed", { msg: c.error }),
    h("button", { class: "btn link sm", style: "margin-left:auto", onclick: () => compareItem(item, c.against) }, t("common.retry")));
  const d = c.data;
  return h("button", { class: "cmpline", onclick: () => openDrawer(item) },
    h("span", { class: "rec " + d.recommendation }, t("rec." + d.recommendation)),
    h("strong", {}, t("cmp.vs", { tool: d.current })),
    h("span", { class: "muted" }, t("cmp.summary", { pros: d.pros.length, cons: d.cons.length, n: (d.sources || []).length })),
    h("span", { class: "go" }, t("cmp.details")));
}

// No comparison on the page yet: show where the automatic one is.
function autoLine(item) {
  const tool = firstRival(item);
  const st = autoStatus(item);
  if (st === "active") return h("div", { class: "cmpline pending", role: "status" }, h("div", { class: "spinner" }), t("cmp.loading", { tool }));
  if (st === "queued") return h("div", { class: "cmpline queued" }, t("ctab.queued", { tool }));
  if (st === "failed") return h("div", { class: "cmpline error", role: "alert" }, t("cmp.failed", { msg: state.auto.failed[nameKey(item.name) + "|" + nameKey(tool)] }),
    h("button", { class: "btn link sm", style: "margin-left:auto", onclick: () => compareItem(item, tool) }, t("common.retry")));
  return tool && h("button", { class: "cmpline", onclick: () => compareItem(item, tool) }, h("strong", {}, t("ctab.start", { tool })));
}

function linksLine(item) {
  if (!item.links?.length) return null;
  return [" ", item.links.map((l, i) => [i ? " · " : "", ext(l.url, l.source || "link"),
    l.official ? h("span", { class: "tag official", style: "margin-left:6px" }, t("tag.firstParty")) : null])];
}

// compare: only in the "So với stack" tab; the radar feed has no compare controls.
function itemArticle(item, { compare = false, market = false, extra = "" } = {}) {
  const c = state.compares[nameKey(item.name)];
  const version = item.version && !item.name.includes(item.version) ? ` ${item.version}` : "";
  const canCompare = compare && (state.profile?.skills || []).length > 0;
  return h("article", { class: "item" },
    h("div", { class: "itemrow" },
      h("div", { class: "itemmain" },
        h("div", { class: "itemtitle" }, market
          ? h("button", { class: "titlebtn", title: t("mk.open", { name: item.name }), onclick: () => openMarket(item) }, item.name + version)
          : h("strong", {}, item.name + version),
          item.category && item.category !== "other" && h("span", { class: "tag" }, catLabel(item.category)),
          extra && h("span", { class: "muted", style: "font-size:13px" }, extra)),
        h("p", { class: "itemtext" }, item.summary, linksLine(item))),
      canCompare && c?.status !== "loading" && compareButton(item)),
    compare && (c ? compareLine(item, c) : autoLine(item)),
    market && "category" in item && marketLine(item));
}

function drawerView() {
  const item = state.drawer.item;
  if (state.drawer.kind === "market") return [
    h("div", { class: "backdrop", onclick: closeDrawer }),
    h("aside", { class: "drawer", role: "dialog", "aria-modal": "true", "aria-labelledby": "drawer-title" },
      h("div", { class: "drawerhead" },
        h("div", { style: "flex:1;min-width:0" }, h("p", { class: "kicker", style: "margin-bottom:4px" }, t("mk.kicker")),
          h("h2", { id: "drawer-title" }, item.name)),
        h("button", { class: "iconbtn", "aria-label": t("cmp.close"), "data-autofocus": true, onclick: closeDrawer },
          svg('<path d="M6 6l12 12M18 6L6 18"/>', 18))),
      marketDrawerBody(item)),
  ];
  const c = state.compares[nameKey(item.name)];
  const sel = h("select", { "aria-label": t("cmp.other") }, toolOptions(item).map(o => h("option", { value: o }, o)));
  sel.value = c?.against || firstRival(item) || "";
  const rerun = h("div", { class: "row", style: "margin:0" }, h("span", { class: "muted", style: "font-size:13px" }, t("cmp.other")), sel,
    h("button", { class: "btn sm", onclick: () => compareItem(item, sel.value) }, t("cmp.run")));
  let body;
  if (!c || c.status === "loading") body = loading(t("cmp.loading", { tool: c?.against || sel.value }));
  else if (c.status === "error") body = h("p", { style: "color:var(--danger);margin:0" }, t("cmp.failed", { msg: c.error }));
  else {
    const d = c.data;
    const byN = Object.fromEntries((d.sources || []).map(s => [s.n, s]));
    const refs = ns => h("span", { class: "refs" }, ns.map(n => byN[n] ? ext(byN[n].url, `[${n}]`) : `[${n}]`));
    const indep = (d.sources || []).filter(s => s.independent).length;
    body = [
      h("div", { class: "verdict" }, h("span", { class: "rec " + d.recommendation }, t("rec." + d.recommendation)),
        h("span", { class: "muted", style: "font-size:13px" }, t("cmp.confidence", { c: t("conf." + d.confidence) }), " · ",
          t("cmp.indepCount", { i: indep, n: (d.sources || []).length }))),
      d.fit && h("p", { class: "fitbox" }, h("b", {}, t("cmp.fit") + " "), d.fit),
      d.what_is_new && h("p", { style: "margin:0;font-size:14px;color:var(--body)" }, h("b", {}, t("cmp.new") + " "), d.what_is_new),
      (d.pros.length + d.cons.length) > 0
        ? [h("h3", { class: "pro" }, t("cmp.pros")), h("ul", { class: "dlist" }, d.pros.map(p => h("li", {}, p.text, " ", refs(p.sources)))),
           h("h3", { class: "con" }, t("cmp.cons")), h("ul", { class: "dlist" }, d.cons.map(p => h("li", {}, p.text, " ", refs(p.sources))))]
        : h("p", { class: "muted", style: "margin:0" }, t("cmp.noEvidence")),
      (d.sources || []).length > 0 && [h("h3", { class: "muted" }, t("cmp.sources")),
        h("ol", { class: "srcs" }, d.sources.map(s => h("li", { value: s.n }, ext(s.url, s.title),
          s.independent && h("span", { class: "tag", style: "margin-left:6px" }, t("cmp.independent")))))],
    ];
  }
  return [
    h("div", { class: "backdrop", onclick: closeDrawer }),
    h("aside", { class: "drawer", role: "dialog", "aria-modal": "true", "aria-labelledby": "drawer-title" },
      h("div", { class: "drawerhead" },
        h("div", { style: "flex:1;min-width:0" }, h("p", { class: "kicker", style: "margin-bottom:4px" }, t("cmp.vs", { tool: c?.against || sel.value })),
          h("h2", { id: "drawer-title" }, item.name)),
        h("button", { class: "iconbtn", "aria-label": t("cmp.close"), "data-autofocus": true, onclick: closeDrawer },
          svg('<path d="M6 6l12 12M18 6L6 18"/>', 18))),
      rerun, body),
  ];
}

function section(icon, title, note, body) {
  return h("section", { class: "card" },
    h("div", { class: "sechead" }, h("span", { class: "ico" }, svg(icon)), h("h2", {}, title), note && h("span", { class: "note" }, note)),
    body);
}
const emptyNote = () => h("p", { class: "muted", style: "margin:0" }, t("sec.empty"));

// "Tổng quan": one compact card per type with headlines only; "Xem chi tiết"
// opens that type's own filter.
const OV_MAX = 6;
function overviewSections(rep) {
  const L = sectionLists(rep);
  // The article's own headline, readable on its own: a bare release tag ("v2.1.327")
  // becomes "Claude Code 2.1.327", a headline that never names the tool gets it
  // in front, and a headline already shown for another item falls back to the name.
  const used = new Set();
  const title = b => {
    const name = b.name + (b.version && !b.name.includes(b.version) ? ` ${b.version}` : "");
    const word = b.name.split(/\s+/)[0].toLowerCase();
    // Every article the item came from (links keep one per source): the one naming
    // this version wins, then one naming the tool, then the first link.
    const heads = [...(b.items || []).map(id => rep.items?.[id]?.title), ...(b.links || []).map(l => l.title)]
      .filter(Boolean).map(x => x.trim());
    const ver = (b.version || "").split(/[\s,]+/)[0].toLowerCase();
    const head = (ver && heads.find(x => x.toLowerCase().includes(ver) && x.toLowerCase().includes(word)))
      || heads.find(x => x.toLowerCase().includes(word)) || (b.links?.[0]?.title || "").trim();
    const bare = /^(v?\d[\w.+-]*|release\b[\d\s:.-]*)$/i.test(head);
    const mentions = head.toLowerCase().includes(word);
    const out = !head || bare || used.has(head) ? name : mentions ? head : `${name}: ${head}`;
    used.add(head);
    return out;
  };
  const cards = [
    ["ai", ICON.spark, t("sec.ai"), L.ai.map(b => ({ text: title(b), item: b }))],
    ["stack", ICON.layers, t("sec.stack"), L.stack.map(title)],
    ["updates", ICON.up, t("sec.updates"), L.updates.map(title)],
    ["other", ICON.branch, t("sec.other"), L.other.map(title)],
    ["new", ICON.compass, t("sec.new"), L.new.map(title)],
    ["themes", ICON.radar, t("sec.themes"), L.themes.map(th => th.title)],
  ];
  return [
    h("p", { class: "muted", style: "margin:-4px 0 0" }, t("ov.hint")),
    h("div", { class: "ovgrid" }, cards.map(([id, icon, name, titles]) => h("section", { class: "card ovcard" },
      h("div", { class: "sechead" }, h("span", { class: "ico" }, svg(icon)), h("h2", {}, name), h("span", { class: "note" }, titles.length)),
      titles.length
        ? h("ul", { class: "ovlist" }, titles.slice(0, OV_MAX).map(x => h("li", {}, typeof x === "string" ? x
            : "category" in x.item ? h("button", { title: t("mk.open", { name: x.item.name }), onclick: () => openMarket(x.item) }, x.text) : x.text)),
            titles.length > OV_MAX && h("li", { class: "more" }, `+${titles.length - OV_MAX}`))
        : h("p", { class: "muted", style: "margin:0 0 12px;flex:1" }, t("sec.empty")),
      titles.length > 0 && h("button", { class: "btn sm", onclick: () => { state.filter = id; render(); window.scrollTo(0, 0); } }, t("cmp.details"))))),
  ];
}

function radarSections(rep) {
  if (state.filter === "all") return overviewSections(rep);
  const L = sectionLists(rep);
  const show = id => state.filter === "all" || state.filter === id;
  const out = [];
  if (show("ai") && (L.ai.length || state.filter === "ai")) {
    const groups = ["models", "coding", "agents"].map(g => [g, L.ai.filter(b => (AI_GROUP_FROM_VI[b.group] || b.group) === g)]).filter(([, m]) => m.length);
    out.push(section(ICON.spark, t("sec.ai"), t("sec.aiHint"),
      groups.length ? groups.map(([g, members]) => [h("h3", { style: "margin:14px 0 4px" }, t("aigroup." + g)), members.map(b => itemArticle(b, { market: true }))]) : emptyNote()));
  }
  if (show("stack")) out.push(section(ICON.layers, t("sec.stack"),
    L.stack.length > 0 && h("button", { class: "btn link sm", onclick: () => { state.tab = "compare"; render(); ensureAuto(); } }, t("ctab.goto")),
    L.stack.length ? L.stack.map(b => itemArticle(b)) : emptyNote()));
  if (show("updates")) out.push(section(ICON.up, t("sec.updates"), null,
    L.updates.length ? h("div", { class: "grid3" }, L.updates.map(b => h("div", { class: "mini" },
      h("strong", {}, b.name + (b.version && !b.name.includes(b.version) ? ` ${b.version}` : "")), h("p", {}, b.summary, linksLine(b))))) : emptyNote()));
  if (show("other") && (L.other.length || state.filter === "other")) out.push(section(ICON.branch, t("sec.other"), null,
    L.other.length ? L.other.map(b => itemArticle(b, { extra: [ECO[b.ecosystem] || "", b.rivals?.[0] ? t("other.sameAs", { tool: b.rivals[0] }) : ""].filter(Boolean).join(" · ") })) : emptyNote()));
  if (show("new")) out.push(section(ICON.compass, t("sec.new"), null,
    L.new.length ? L.new.map(b => itemArticle(b)) : emptyNote()));
  if (show("themes")) out.push(h("section", { class: "card" }, h("h2", { style: "margin-bottom:6px" }, t("sec.themes")),
    L.themes.length ? L.themes.map(th => h("div", { class: "theme" }, h("strong", {}, th.title),
      h("p", {}, th.summary, " ", th.links.map((l, i) => [i ? " · " : "", ext(l.url, l.source || "link")])))) : emptyNote()));
  return out;
}

function radarAside() {
  const rep = state.report;
  const L = rep ? sectionLists(rep) : null;
  const counts = L ? { ai: L.ai.length, stack: L.stack.length, updates: L.updates.length, other: L.other.length, new: L.new.length, themes: L.themes.length } : {};
  const all = Object.values(counts).reduce((a, b) => a + b, 0);
  const ids = ["all", "ai", "stack", "updates", "other", "new", "themes"];
  const skills = state.profile?.skills || [];
  return h("aside", { class: "side" },
    h("section", { class: "card tight", "aria-label": t("filter.title") },
      h("p", { class: "sidelabel" }, t("filter.title")),
      h("div", { class: "filters" }, ids.map(id => h("button", { "aria-pressed": String(state.filter === id),
        onclick: () => { state.filter = id; render(); } },
        h("span", {}, t("filter." + id)), h("span", { class: "count" }, id === "all" ? all : (counts[id] ?? 0)))))),
    h("section", { class: "card tight", "aria-label": t("stackbox.title") },
      h("div", { class: "row", style: "margin:0 0 10px" }, h("p", { class: "sidelabel", style: "margin:0 0 0 4px" }, t("stackbox.title")), h("span", { class: "spacer" }),
        h("button", { class: "btn link sm", onclick: () => { state.tab = "profile"; render(); } }, t("common.edit"))),
      h("div", { class: "chips" }, skills.slice(0, 10).map(s => h("span", { class: "chip" }, s.name)),
        skills.length > 10 && h("span", { class: "chip", style: "background:none" }, `+${skills.length - 10}`))),
    h("p", { class: "muted", style: "margin:0 4px;font-size:13px" }, t("radar.aside")));
}

function radarTab() {
  const r = state.radar || {};
  const rep = state.report;
  const [y, w] = rep ? rep.week.split("-W") : [];
  const weekSel = state.reports && state.reports.length > 1 && (() => {
    const sel = h("select", { "aria-label": t("radar.weekSelect") }, state.reports.map(wk => {
      const [yy, ww] = wk.split("-W"); return h("option", { value: wk }, t("radar.week", { w: +ww, y: yy }));
    }));
    sel.value = rep ? rep.week : state.reports[0];
    sel.addEventListener("change", () => loadReports(sel.value));
    return sel;
  })();
  const head = h("section", { style: "display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap" },
    h("div", { style: "flex:1 1 320px" },
      rep && h("p", { class: "kicker" }, t("radar.week", { w: +w, y })),
      h("h1", { class: "page" }, state.filter === "all" ? t("heading.all") : t({ ai: "sec.ai", stack: "sec.stack", updates: "sec.updates", other: "sec.other", new: "sec.new", themes: "sec.themes" }[state.filter])),
      rep && h("p", { class: "muted", style: "margin:8px 0 0" }, t("radar.read", { items: rep.stats.items, sources: rep.stats.sources }))),
    h("div", { class: "row", style: "margin:0" }, weekSel,
      h("button", { class: "btn" + (rep ? "" : " primary"), onclick: startRadar, disabled: !!r.running },
        r.running ? t("radar.running") : rep ? t("radar.rerun") : t("radar.run"))));
  const status = r.running && h("div", { class: "card tight" }, h("div", { class: "loading" }, h("div", { class: "spinner" }),
    h("span", { id: "radar-step" }, t("stage." + (r.step || "start")))));
  let body;
  if (!state.reports) body = h("div", { class: "card" }, loading(t("common.loading")));
  else if (!rep) body = h("div", { class: "card" }, h("p", { class: "muted", style: "margin:0" }, t("radar.empty")));
  else body = radarSections(rep);
  return h("div", { class: "layout" }, radarAside(), h("main", { class: "content" }, head, status, body));
}

// ---------------------------------------------------------------- "So với stack" tab

// New technologies grouped by the skill they compete with (their natural rival).
function compareGroups(rep) {
  const L = sectionLists(rep);
  const skills = state.profile?.skills || [];
  const groups = new Map();
  // New models are compared with rival models (their own drawer), not with an SDK of the stack.
  const MODEL_CATS = ["llm-provider-sdk", "local-llm-inference"];
  for (const item of [...L.stack, ...L.ai].filter(b => !MODEL_CATS.includes(b.category))) {
    const rival = firstRival(item);
    if (!rival) continue;
    const k = nameKey(rival);
    if (!groups.has(k)) groups.set(k, { key: k, skill: skills.find(s => nameKey(s.name) === k) || { name: rival }, items: [] });
    groups.get(k).items.push(item);
  }
  return [...groups.values()].sort((a, b) => b.items.length - a.items.length);
}

function compareAside(groups) {
  const total = groups.reduce((n, g) => n + g.items.length, 0);
  const button = (id, label, count) => h("button", { "aria-pressed": String(state.skillFilter === id),
    onclick: () => { state.skillFilter = id; render(); } }, h("span", {}, label), h("span", { class: "count" }, count));
  return h("aside", { class: "side" },
    h("section", { class: "card tight", "aria-label": t("ctab.skills") },
      h("p", { class: "sidelabel" }, t("ctab.skills")),
      h("div", { class: "filters" }, button("all", t("ctab.allSkills"), total),
        groups.map(g => button(g.key, g.skill.name, g.items.length)))),
    h("p", { class: "muted", style: "margin:0 4px;font-size:13px" }, t("ctab.hint")));
}

function compareTab() {
  const rep = state.report;
  if (!state.reports) return h("main", { class: "content single" }, h("div", { class: "card" }, loading(t("common.loading"))));
  if (!rep) return h("main", { class: "content single" }, h("div", { class: "card" }, h("p", { class: "muted", style: "margin:0" }, t("radar.empty"))));
  const [y, w] = rep.week.split("-W");
  const groups = compareGroups(rep);
  if (!groups.some(g => g.key === state.skillFilter)) state.skillFilter = "all";
  const shown = groups.filter(g => state.skillFilter === "all" || g.key === state.skillFilter);
  const a = state.auto;
  const progress = a?.running && a.week === rep.week && h("div", { class: "card tight" },
    h("div", { class: "loading" }, h("div", { class: "spinner" }), h("span", {}, t("ctab.progress", { done: a.done, total: a.total }))));
  const head = h("section", {},
    h("p", { class: "kicker" }, t("radar.week", { w: +w, y })),
    h("h1", { class: "page" }, t("ctab.title")));
  const body = groups.length
    ? shown.map(g => h("section", { class: "card" },
        h("div", { class: "sechead" }, h("span", { class: "ico" }, svg(ICON.layers)),
          h("h2", {}, g.skill.name), g.skill.level && levelBadge(g.skill.level),
          h("span", { class: "note" }, [g.skill.category && catLabel(g.skill.category), t("ctab.count", { n: g.items.length })].filter(Boolean).join(" · "))),
        g.items.map(item => itemArticle(item, { compare: true }))))
    : h("div", { class: "card" }, h("p", { class: "muted", style: "margin:0" }, t("ctab.empty")));
  return h("div", { class: "layout" }, compareAside(groups), h("main", { class: "content" }, head, progress, body));
}

// ---------------------------------------------------------------- render

function render() {
  applyLang();
  let body;
  if (state.view === "loading") body = h("div", { class: "card" }, loading(t("common.loading")));
  else if (state.view === "wizard") body = h("main", { class: "content single" }, wizardView());
  else if (state.view === "review") body = h("main", { class: "content single" }, reviewView());
  else if (state.tab === "radar") body = radarTab();
  else if (state.tab === "compare") body = compareTab();
  else body = h("main", { class: "content single" }, state.tab === "sources" ? sourcesTab() : profileTab());
  document.getElementById("app").replaceChildren(...headerView().filter(Boolean), body, ...(state.drawer ? drawerView() : []));
  document.body.style.overflow = state.drawer ? "hidden" : "";
  const focusTarget = document.querySelector("[data-autofocus]");
  if (focusTarget && !focusTarget.contains(document.activeElement)) focusTarget.focus();
}

document.addEventListener("click", e => {
  if (state.menuOpen && !e.target.closest(".split")) { state.menuOpen = null; render(); }
});
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (state.menuOpen) { state.menuOpen = null; render(); }
  else if (state.drawer) closeDrawer();
});

(async function init() {
  applyTheme();
  try {
    const [meta, { profile }, radar, settings] = await Promise.all(
      [api("GET", "/api/meta"), api("GET", "/api/profile"), api("GET", "/api/radar/status"), api("GET", "/api/settings")]);
    state.meta = meta; state.profile = profile; state.radar = radar;
    const saved = store.get("ss-lang");
    // Never picked: propose the browser's language and remember it on the server,
    // so AI-written content and the digests use it too.
    const browser = (navigator.languages || [navigator.language || ""]).map(l => String(l).split("-")[0].toLowerCase())
      .find(l => meta.languages.includes(l));
    state.lang = meta.languages.includes(saved) ? saved : settings.chosen ? settings.language : (browser || settings.language);
    if (!settings.chosen && state.lang !== settings.language) api("PUT", "/api/settings", { language: state.lang }).catch(() => {});
    state.view = profile ? "main" : "wizard";
    if (profile) { loadReports(); if (radar.running) pollRadar(); }
  } catch (e) {
    toast(e.message, { error: true });
  }
  render();
})();
</script>

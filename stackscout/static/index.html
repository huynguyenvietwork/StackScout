function h(tag, attrs = {}, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat(Infinity)) if (c != null && c !== false) el.append(c.nodeType ? c : String(c));
  return el;
}

function demoApi(method, path, body) {
  const D = DEMO, p = path.split("?")[0];
  const routes = {
    "/api/meta": D.meta, "/api/profile": { profile: D.profile }, "/api/settings": { language: "en", chosen: false },
    "/api/radar/status": { running: false, step: "", error: null, week: D.report.week }, "/api/reports": { weeks: [D.report.week] },
    [`/api/reports/${D.report.week}`]: D.report, "/api/compare": { comparisons: D.comparisons }, "/api/market": { market: D.market },
    "/api/sources": D.sources, "/api/notify": demoNotify(D),
  };
  if (method === "GET" && p in routes) return structuredClone(routes[p]);
  if (p === "/api/compare/auto") return { running: false, week: D.report.week, total: 0, done: 0, active: [], failed: {} };
  if (method === "PUT" && p === "/api/settings") return body;  // switching language works in the demo
  if (p === "/api/client-log") return {};
  throw new ApiError(t("demo.readonly"));
}

async function api(method, path, body) {
  if (DEMO) return demoApi(method, path, body);
  let res;
  try {
    res = await fetch(path, { method, headers: body ? { "Content-Type": "application/json" } : {},
                              body: body ? JSON.stringify(body) : undefined });
  } catch {
    throw new ApiError(t("err.network", { host: location.host }));
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    if (res.status === 502) throw new ApiError(t("err.ai"));
    const d = data.detail;
    const msg = typeof d === "string" ? d : Array.isArray(d) ? d.map(x => x.msg).join("; ") : t("err.generic");
    throw new ApiError(msg);
  }
  return data;
}

function reportError(message, detail = "") {
  console.error("[StackScout]", message, detail);
  if (DEMO) return;
  fetch("/api/client-log", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message: String(message).slice(0, 2000), detail: String(detail).slice(0, 8000) }) }).catch(() => {});
}
window.addEventListener("error", e => { reportError(e.message, e.error?.stack || ""); toast(t("err.page", { msg: e.message }), { error: true }); });
window.addEventListener("unhandledrejection", e => {
  const msg = e.reason?.message || String(e.reason);
  reportError(msg, e.reason?.stack); toast(t("err.page", { msg }), { error: true });
});

let toastTimer;
function toast(message, { error = false, action } = {}) {
  document.querySelector(".toast")?.remove();
  clearTimeout(toastTimer);
  const el = h("div", { class: "toast" + (error ? " error" : ""), role: "status" }, message,
    action && h("button", { onclick: () => { el.remove(); action.run(); } }, action.label));
  document.body.append(el);
  toastTimer = setTimeout(() => el.remove(), action ? 7000 : 4500);
}

async function run(label, fn) {
  state.busy = label; render();
  try { await fn(); }
  catch (e) { if (!(e instanceof ApiError)) reportError(e.message, e.stack); toast(e.message, { error: true }); }
  finally { state.busy = null; render(); }
}

function wizardView() {
  const q = QUESTIONS[state.step];
  const last = state.step === QUESTIONS.length - 1;
  const maxlength = q.key === "skills" || q.key === "project" ? 20000 : 4000;
  const box = h("textarea", { rows: q.key === "skills" ? 4 : 3, "aria-label": t(`q.${q.key}.title`), "data-autofocus": true, maxlength });
  box.value = state.answers[q.key];
  box.addEventListener("input", () => { state.answers[q.key] = box.value; });
  const next = () => {
    state.answers[q.key] = box.value.trim();
    if (q.required && !state.answers[q.key]) { toast(t("wiz.required")); box.focus(); return; }
    if (last) return makeDraft();
    state.step++; render();
  };

async function loadReports(week) {
  await run(null, async () => {
    const { weeks } = await api("GET", "/api/reports");
    state.reports = weeks;
    const pick = week && weeks.includes(week) ? week : weeks[0];
    state.report = pick ? await api("GET", `/api/reports/${encodeURIComponent(pick)}`) : null;
    state.compares = {}; state.market = {};
    if (state.report) {
      const { comparisons } = await api("GET", `/api/compare?week=${encodeURIComponent(state.report.week)}`);
      mergeComparisons(comparisons);
      mergeMarket((await api("GET", `/api/market?week=${encodeURIComponent(state.report.week)}`)).market);
    }
  });
  restoreDetailFromHash();
  if (state.detail) render();
  ensureAuto();
}

// Several cached comparisons for one item: show the one against its natural
// rival, unless the reader picked another tool with ⋯ (that one stays).
function mergeComparisons(comparisons) {
  const lists = sectionLists(state.report);
  const rivalsOf = Object.fromEntries([...lists.ai, ...lists.stack, ...lists.other, ...lists.new]
    .map(it => [nameKey(it.name), (it.rivals || []).map(nameKey)]));
  for (const [key, c] of Object.entries(comparisons)) {
    const [name, against] = key.split("|");
    const cur = state.compares[name];
    if (cur?.manual) continue;
    const isRival = (rivalsOf[name] || []).includes(against);
    if (!cur || cur.status !== "done" || isRival) state.compares[name] = { status: "done", data: c, against: c.current };
  }
}

function mergeMarket(market) {
  for (const [name, c] of Object.entries(market || {})) {
    if (state.market[name]?.status !== "done") state.market[name] = { status: "done", data: c };
  }
}

// ---- "Model & AI mới": a new model or tool vs its 3-5 strongest rivals.
// Usually ready (the automatic run does it after the radar); a click on one
// that is not done yet starts it now (the server never runs it twice).
async function marketItem(item, force = false) {
  const k = nameKey(item.name);
  state.market[k] = { status: "loading" }; render();
  try {
    const { comparison } = await api("POST", "/api/market", { week: state.report.week, name: item.name, force });
    state.market[k] = { status: "done", data: comparison };
  } catch (e) {
    state.market[k] = { status: "error", error: e.message };

function marketStatus(item) {
  const m = state.market[nameKey(item.name)];
  if (m) return m.status;
  const a = state.auto, key = "market|" + nameKey(item.name);
  if (!a || a.week !== state.report?.week) return null;
  if ((a.active || []).includes(key)) return "active";
  if ((a.failed || {})[key]) return "failed";
  return a.running ? "queued" : null;
}

function openMarket(item) {

// ---- automatic comparisons ("So với stack" tab): the server compares every
// new technology with its natural rival in the background; the page polls.
async function ensureAuto() {
  if (!state.report) return;
  try { state.auto = await api("POST", "/api/compare/auto", { week: state.report.week }); } catch { return; }
  if (state.tab === "compare") render();
  if (state.auto.running) pollAuto();
}

function pollAuto() {
  clearTimeout(state.autoTimer);
  state.autoTimer = setTimeout(async () => {
    const week = state.report?.week;
    try {
      state.auto = await api("GET", "/api/compare/auto");
      if (week && state.auto.week === week) {
        mergeComparisons((await api("GET", `/api/compare?week=${encodeURIComponent(week)}`)).comparisons);
        mergeMarket((await api("GET", `/api/market?week=${encodeURIComponent(week)}`)).market);
      }
    } catch { /* keep polling */ }
    if (state.auto?.running) pollAuto();
    else if (state.auto?.total) toast(t("ctab.allDone", { n: state.auto.total - Object.keys(state.auto.failed || {}).length }));
    // Do not rebuild the page under an open menu (it would drop the search text); an open
    // detail page is rebuilt only when what it is waiting for has arrived (keeps the reader's place).
    const waiting = state.detail?.kind === "market" && state.market[nameKey(state.detail.item.name)]?.status === "done"
      && !state.detail.shownDone;
    if (waiting) state.detail.shownDone = true;
    if (!state.menuOpen && (!state.detail || waiting)) render();
  }, 5000);
}

function autoStatus(item) {

  const key = nameKey(item.name) + "|" + nameKey(rival);
  if ((a.active || []).includes(key)) return "active";
  if ((a.failed || {})[key]) return "failed";
  return a.running ? "queued" : null;
}

// "Tổng quan": one compact card per type with headlines only; "Xem chi tiết"
// opens that type's own filter.
const OV_MAX = 6;
function overviewSections(rep) {
  const L = sectionLists(rep);
  // The article's own headline, readable on its own: a bare release tag ("v2.1.327")
  // becomes "Claude Code 2.1.327", a headline that never names the tool gets it
  // in front, and a headline already shown for another item falls back to the name.
  const used = new Set();
  const title = b => {
    const name = b.name + (b.version && !b.name.includes(b.version) ? ` ${b.version}` : "");
    const word = b.name.split(/\s+/)[0].toLowerCase();
    // Every article the item came from (links keep one per source): the one naming
    // this version wins, then one naming the tool, then the first link.
    const heads = [...(b.items || []).map(id => rep.items?.[id]?.title), ...(b.links || []).map(l => l.title)]
      .filter(Boolean).map(x => x.trim());
    const ver = (b.version || "").split(/[\s,]+/)[0].toLowerCase();
    const head = (ver && heads.find(x => x.toLowerCase().includes(ver) && x.toLowerCase().includes(word)))
      || heads.find(x => x.toLowerCase().includes(word)) || (b.links?.[0]?.title || "").trim();
    const bare = /^(v?\d[\w.+-]*|release\b[\d\s:.-]*)$/i.test(head);
    const mentions = head.toLowerCase().includes(word);
    const out = !head || bare || used.has(head) ? name : mentions ? head : `${name}: ${head}`;
    used.add(head);
    return out;
  };
  const cards = [
    ["ai", ICON.spark, t("sec.ai"), L.ai.map(b => ({ text: title(b), item: b }))],
    ["stack", ICON.layers, t("sec.stack"), L.stack.map(title)],
    ["updates", ICON.up, t("sec.updates"), L.updates.map(title)],
    ["other", ICON.branch, t("sec.other"), L.other.map(title)],
    ["new", ICON.compass, t("sec.new"), L.new.map(title)],
    ["themes", ICON.radar, t("sec.themes"), L.themes.map(th => th.title)],
  ];
  return [
    h("p", { class: "muted", style: "margin:-4px 0 0" }, t("ov.hint")),
    h("div", { class: "ovgrid" }, cards.map(([id, icon, name, titles]) => h("section", { class: "card ovcard" },
      h("div", { class: "sechead" }, h("span", { class: "ico" }, svg(icon)), h("h2", {}, name), h("span", { class: "note" }, titles.length)),
      titles.length
        ? h("ul", { class: "ovlist" }, titles.slice(0, OV_MAX).map(x => h("li", {}, typeof x === "string" ? x
            : "category" in x.item ? h("button", { title: t("mk.open", { name: x.item.name }), onclick: () => openMarket(x.item) }, x.text) : x.text)),
            titles.length > OV_MAX && h("li", { class: "more" }, `+${titles.length - OV_MAX}`))
        : h("p", { class: "muted", style: "margin:0 0 12px;flex:1" }, t("sec.empty")),
      titles.length > 0 && h("button", { class: "btn sm", onclick: () => { state.filter = id; render(); window.scrollTo(0, 0); } }, t("cmp.details"))))),

// New technologies grouped by the skill they compete with (their natural rival).
function compareGroups(rep) {
  const L = sectionLists(rep);
  const skills = state.profile?.skills || [];
  const groups = new Map();
  // New models are compared with rival models (their own drawer), not with an SDK of the stack.
  const MODEL_CATS = ["llm-provider-sdk", "local-llm-inference"];
  for (const item of [...L.stack, ...L.ai].filter(b => !MODEL_CATS.includes(b.category))) {
    const rival = firstRival(item);
    if (!rival) continue;
    const k = nameKey(rival);
    if (!groups.has(k)) groups.set(k, { key: k, skill: skills.find(s => nameKey(s.name) === k) || { name: rival }, items: [] });
    groups.get(k).items.push(item);
  }
  return [...groups.values()].sort((a, b) => b.items.length - a.items.length);
}

    // Never picked: propose the browser's language and remember it on the server,
    // so AI-written content and the digests use it too.
    const browser = (navigator.languages || [navigator.language || ""]).map(l => String(l).split("-")[0].toLowerCase())
      .find(l => meta.languages.includes(l));
    state.lang = meta.languages.includes(saved) ? saved : settings.chosen ? settings.language : (browser || settings.language);
    if (!settings.chosen && state.lang !== settings.language) api("PUT", "/api/settings", { language: state.lang }).catch(() => {});
    state.view = profile ? "main" : "wizard";
    if (profile) { loadReports(); if (radar.running) pollRadar(); }
  } catch (e) {
    toast(e.message, { error: true });
  }
  render();
})();
</script>
</body>
</html>

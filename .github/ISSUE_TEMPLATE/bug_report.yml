name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Run `uv run main.py web`\n2. ..."
  - type: input
    id: setup
    attributes:
      label: Setup
      description: OS, how you run it (uv / Docker), AI backend (API key / Claude CLI), notification channel.
  - type: textarea
    id: logs
    attributes:
      label: Server log lines
      description: Remove API keys, tokens, webhook URLs and anything personal before pasting.
      render: text

ls rivals on terminal coding and computer use, and GPT-6.1 Terra and Sol cost less per task.","rivals":[{"name":"Claude Sonnet 5.5","vendor":"Anthropic","pros":[{"text":"It nearly matches Sonnet on intelligence (AA Index 54 vs 55 at max effort) for about a third of the cost per task ($3.16 vs $10.02).","sources":[3,5]},{"text":"It is cheaper per token ($1.50/$7.50 vs $2/$10) and faster (169 vs 146 tok/s; about 109 s vs 488 s mean end-to-end).","sources":[3]},{"text":"Google's table puts it ahead on knowledge work (Agents' Last Exam 71.6% vs 60.4%, AutomationBench-AA 76.1% vs 71.8%), and a hands-on review saw it lead on bug-fixing across codebases.","sources":[1,8]}],"cons":[{"text":"It trails on terminal coding: 54% vs 64% on AA's Terminal-Bench 4.0, and 57.0% vs 63.9% on Google's Terminal-Bench 4.1.","sources":[1,5]},{"text":"It is weaker at computer use, with 77.6% vs 83.9% on OSWorld-2.1 (offline subset).","sources":[1,8]},{"text":"It is behind on science-terminal tasks: 50% vs 53% per AA, and 51.4% vs 59.9% per Google.","sources":[1,5]}],"verdict":"Pick Gemini 4 Hydrogen for fast, low-cost agentic and knowledge work; pick Sonnet 5.5 for terminal-heavy coding or computer-use agents where accuracy matters more than cost."},{"name":"GPT-6.1 Terra","vendor":"OpenAI","pros":[{"text":"It scores higher on intelligence (AA Index 54 vs 51 at max).","sources":[4,5]},{"text":"It is much faster: 169 vs 65 tok/s, with about 109 s vs 311 s mean end-to-end time.","sources":[4]},{"text":"Google's table puts it ahead on AutomationBench-AA (76.1% vs 60.2%), OSWorld-2.1 (77.6% vs 74.2%) and HLE-Diamond (58.8% vs 47.3%).","sources":[1]}],"cons":[{"text":"Terra costs less per token ($1/$5 vs $1.50/$7.50).","sources":[4,7]},{"text":"It costs much more per task: $3.16 vs $0.96 at max effort, and $1.87 vs $0.26 at high.","sources":[4,7]},{"text":"It is behind on Terminal-Bench-Science 0.1 (51.4% vs 58.3%).","sources":[1]}],"verdict":"Pick Gemini 4 Hydrogen when quality and latency matter; pick GPT-6.1 Terra for high-volume, cost-sensitive workloads."},{"name":"GPT-6.1 Sol","vendor":"OpenAI","pros":[{"text":"It costs less per token ($1.50/$7.50 vs $2/$10).","sources":[7]},{"text":"It is slightly faster per AA task (8.3 min at high vs 9.8 min for Sol at xhigh).","sources":[7]},{"text":"It is the best model at its price point at high, medium and low effort, per Artificial Analysis.","sources":[5]}],"cons":[{"text":"It is slightly behind on intelligence (AA Index 54 vs 55 at max effort).","sources":[5]},{"text":"It costs about 2.5x as much per task at max effort; at high it is $1.87 vs $0.76 for Sol at xhigh.","sources":[5,7]},{"text":"It trails on AA's Terminal-Bench 4.0 (54% vs 56%) and Terminal-Bench-Science (50% vs 58%).","sources":[5]}],"verdict":"Pick Gemini 4 Hydrogen for lower per-token prices and Google ecosystem integration; pick GPT-6.1 Sol for slightly stronger reasoning and terminal work at a lower cost per task."},{"name":"Gemini 3.8 Flash","vendor":"Google","pros":[{"text":"It is much smarter (AA Index 51 vs 31 at high), and Google reports Terminal-Bench 4.1 at 57% vs 18.2%.","sources":[6]},{"text":"Per AA, it is cheaper and faster per task at high ($1.87 vs $7.77; 8.3 vs 14.8 min).","sources":[6]},{"text":"Google says it fabricates claims more than 5x less often and is more than 2.3x more resistant to indirect prompt injection (vendor-reported).","sources":[2,6]}],"cons":[{"text":"Flash's list price is half Hydrogen's ($0.75/$3.75) until Dec 31, 2026, when it rises to match.","sources":[6,7]},{"text":"Google's model card notes it refuses more safe requests than 3.8 Flash, especially multimodal ones.","sources":[6]},{"text":"Migrating breaks some setups: it ignores temperature/top_p/top_k, has no minimal thinking level or explicit caching, and can return MALFORMED_FUNCTION_CALL errors.","sources":[6,7]}],"verdict":"Pick Gemini 4 Hydrogen for almost any new agentic or coding work; stay on 3.8 Flash only for simple, high-volume calls until its price rises in January 2027."}],"insufficient":false,"confidence":"medium","sources":[{"n":1,"title":"Gemini 4 Hydrogen - Model Card (Google DeepMind)","url":"https://deepmind.google/models/model-cards/gemini-4-hydrogen/","independent":false},{"n":2,"title":"Gemini 4 Hydrogen: everyday coding and agentic workflows for developers (Google)","url":"https://blog.google/innovation-and-ai/technology/developers-tools/build-with-gemini-4-hydrogen/","independent":false},{"n":3,"title":"Gemini 4 Hydrogen vs Claude Sonnet 5.5 - Artificial Analysis","url":"https://artificialanalysis.ai/models/comparisons/gemini-4-hydrogen-vs-claude-sonnet-5-5","independent":true},{"n":4,"title":"Gemini 4 Hydrogen vs GPT-6.1 Terra - Artificial Analysis","url":"https://artificialanalysis.ai/models/comparisons/gemini-4-hydrogen-vs-gpt-6-1-terra","independent":true},{"n":5,"title":"Google's Gemini 4 Hydrogen outscores the bigger Argon just four weeks after its launch (The Decoder)","url":"https://the-decoder.com/googles-gemini-4-hydrogen-outscores-the-bigger-argon-just-four-weeks-after-its-launch/","independent":true},{"n":6,"title":"Gemini 4 Hydrogen: Benchmarks, Pricing and What Changes for Developers (Neurohive)","url":"https://neurohive.io/en/news/gemini-4-hydrogen-benchmarks-pricing-api/","independent":true},{"n":7,"title":"8 best Gemini 4 Hydrogen alternatives in 2026, compared per task (eesel)","url":"https://www.eesel.ai/blog/gemini-4-hydrogen-alternatives","independent":true},{"n":8,"title":"Gemini 4 Hydrogen Review: Coding, Agents, and Benchmarks vs Sonnet (MindStudio)","url":"https://www.mindstudio.ai/blog/gemini-4-hydrogen-hands-on-review","independent":true}],"independent_sources":6,"generated_at":"2026-11-19T02:42:19+00:00"},"gpt-6.2 sol":{"new":"GPT-6.2 Sol","category":"llm-provider-sdk","category_label":"LLM & SDK","summary":"GPT-6.2 Sol is OpenAI's $2/$10-per-1M-token everyday model with a 1M-token context window, and it scores 57 on the Artificial Analysis Intelligence Index at only $1.01 per index task. That makes it the cost-per-task leader, but Claude Opus 5.5 and the Gemini 4 models beat it on raw quality and hallucination rate, and early hands-on reviews are mixed.","rivals":[{"name":"Claude Sonnet 5.5","vendor":"Anthropic","pros":[{"text":"Same $2/$10 list price, but Sol scores higher on the Artificial Analysis Intelligence Index (57 vs 55) and costs about a tenth as much per index task ($1.01 vs $10.02).","sources":[3,10]},{"text":"In Bito's independent coding runs, Sol at high effort scored 76.5% overall vs 65.7% for Sonnet 5.5.","sources":[4]},{"text":"Sol leads on Terminal-Bench-Science 0.1 (68.0% vs 59.9%) and FrontierCode 2.0 (43.8% vs 42.2%).","sources":[9]}],"cons":[{"text":"Sonnet 5.5 generates output almost twice as fast (146 vs 79 tokens/s).","sources":[3,10]},{"text":"In Bito's hard coding sessions, Sonnet 5.5 finished in 8.6 min at $1.28 vs 29.5 min at $2.22 for Sol.","sources":[4]},{"text":"Sonnet 5.5 leads on Terminal-Bench 4.1 (63.9% vs 61.5%), HealthBench Professional (69.2% vs 65.9%) and the LLM Stats composite score (56.3 vs 53.9).","sources":[8,9]}],"verdict":"Pick GPT-6.2 Sol if you want more accuracy per dollar on long agentic coding work; pick Sonnet 5.5 if you want faster interactive sessions at the same token price."},{"name":"Claude Opus 5.5","vendor":"Anthropic","pros":[{"text":"Sol costs half as much per token ($2/$10 vs $4/$20).","sources":[6,11]},{"text":"On the Artificial Analysis index, Sol costs about a tenth as much per task ($1.01 vs $10.04) and runs about 3x faster (8.5 vs 24.6 min).","sources":[6]},{"text":"Google's comparison table shows Sol ahead on Agents' Last Exam (73.0% vs 71.6%) and GraphWalks 1M-token long context (80.1% vs 66.8%), though these are vendor-reported numbers.","sources":[5]}],"cons":[{"text":"Opus 5.5 is clearly stronger in Bito's independent coding runs (85.0% vs 76.5% overall; 87.4% vs about 70% on a rate-limiting build task).","sources":[4]},{"text":"Sol scores lower "Gemini 4 Neon is one day old. It costs $3/$15 per 1M tokens, has a 1M-token context window, and scores 61 on Artificial Analysis's Intelligence Index (#6 of 96), which puts it above Claude Opus 5.5 and GPT-6.2 Sol but below Claude Fable 5.2 and GPT-6.2 Astra. It produces a lot of tokens, so it costs more and takes longer per task than OpenAI's models, and there are almost no independent hands-on reports yet.","rivals":[{"name":"Claude Opus 5.5","vendor":"Anthropic","pros":[{"text":"Neon scores higher on the AA Intelligence Index (61 vs 59 at top effort) and costs less per task ($6.44 vs $10.04).","sources":[5]},{"text":"Neon is cheaper per token ($3/$15 vs $4/$20) and scores higher on Terminal-Bench 4.0 (63.6% vs 59.6%).","sources":[5]},{"text":"Neon hallucinates far less on AA-Omniscience (13.9% vs 50.3%).","sources":[12]}],"cons":[{"text":"Opus 5.5 scores higher on FrontierCode-AA 2.0 (46.4% vs 44.4%), and Google's own table also shows Opus slightly ahead on Terminal-Bench 4.1 (65.8% vs 65.2%).","sources":[3,5]},{"text":"Hacker News users say Opus 5.5 holds up better on long, multistep agentic builds, while Gemini models fall apart.","sources":[11]},{"text":"Opus is faster at low effort (3.1 vs 3.7 min per task, 4.85s vs 13.93s time to first token) and outputs slightly more tokens per second (118 vs 110).","sources":[5]}],"verdict":"Pick Gemini 4 Neon for lower cost, fewer hallucinations and terminal-style agent tasks; pick Opus 5.5 for proven long-horizon agentic coding."},{"name":"GPT-6.2 Sol","vendor":"OpenAI","pros":[{"text":"Neon scores higher on the AA Intelligence Index (61 vs 57) and on Terminal-Bench 4.0 (63.6% vs 60.1%).","sources":[6]},{"text":"Neon outputs tokens faster (110 vs 79 tok/s) and also accepts speech and video input, which Sol does not.","sources":[6]},{"text":"Neon's AA-Omniscience hallucination rate is much lower (13.9% vs 55.4%).","sources":[12]}],"cons":[{"text":"Sol costs far less per task at max effort ($1.01 vs $6.44) and finishes faster (8.5 vs 21.5 min).","sources":[6]},{"text":"Sol is cheaper per token ($2/$10 vs $3/$15) and also cheaper and faster at low and medium effort.","sources":[6]},{"text":"The two models tie on FrontierCode-AA 2.0 (44.4%).","sources":[6]}],"verdict":"Pick Gemini 4 Neon when accuracy and multimodal input matter more than cost; pick GPT-6.2 Sol for high-volume, cost- or latency-sensitive workloads."},{"name":"Claude Fable 5.2","vendor":"Anthropic","pros":[{"text":"Neon costs about a quarter as much per task ($6.44 vs $26.54) and takes about half the time (21.5 vs 41.6 min).","sources":[7]},{"text":"Neon's token prices are much lower ($3/$15 vs $8/$40), and a Hacker News commenter says it 'matches Fable 5.2 for about 40% the cost'.","sources":[7,11]},{"text":"Neon scores higher on Terminal-Bench 4.0 (63.6% vs 59.6%).","sources":[7]}],"cons":[{"text":"Fable 5.2 leads the AA Intelligence Index (65 vs 61).","sources":[7]},{"text":"Fable 5.2 scores higher on FrontierCode-AA 2.0 (48.8% vs 44.4%).","sources":[7]}],"verdict":"Pick Gemini 4 Neon for near-frontier quality at about a quarter of the cost; pick Fable 5.2 when you need the highest measured intelligence and budget is not a concern."},{"name":"GPT-6.2 Astra","vendor":"OpenAI","pros":[{"text":"Neon is much cheaper per token ($3/$15 vs $8/$40, cache hit $0.15 vs $0.40).","sources":[8]},{"text":"Neon outputs tokens about twice as fast (110 vs 50 tok/s) and has a lower time to first token (56.5 vs 197.7).","sources":[8]},{"text":"Neon accepts speech and video input; Astra accepts only text and images.","sources":[8]}],"cons":[{"text":"Astra edges Neon on the AA Intelligence Index (62 vs 61), Terminal-Bench 4.0 (64.1% vs 63.6%) and FrontierCode-AA 2.0 (45.4% vs 44.4%).","sources":[8]},{"text":"Neon is very verbose (283M output tokens on the AA index vs a 65.1M median), so it ends up costing more per task than Astra ($6.44 vs $4.00).","sources":[4,8]},{"text":"Astra finishes tasks faster (13.7 vs 21.5 min per task).","sources":[8]}],"verdict":"Pick Gemini 4 Neon for faster output and multimodal input; pick GPT-6.2 Astra for slightly better scores at a lower cost per task."},{"name":"Gemini 4 Carbon","vendor":"Google","pros":[{"text":"Neon scores slightly higher on the AA Intelligence Index (61 vs 60) and on FrontierCode-AA 2.0 (44.4% vs 40.6%).","sources":[9]},{"text":"Neon is much faster (21.5 vs 37.2 min per task, 110 vs 55 tok/s).","sources":[9]},{"text":"Neon costs less per task ($6.44 vs $7.76 on AA; Google says 32% less at high effort), and Google says it makes fewer unrequested code changes.","sources":[1,2,9]}],"cons":[{"text":"Carbon scores higher on Terminal-Bench 4.0 (65.2% vs 63.6%).","sources":[9]},{"text":"Carbon hallucinates slightly less on AA-Omniscience (11.4% vs 13.9%).","sources":[12]},{"text":"In Plotly's data-analysis bench, a full Carbon run cost $11.55 vs $17.03 for Neon (scores 42/43 vs 43/43), and Carbon reportedly has promo pricing of $2/$10 until Nov 30.","sources":[10,12]}],"verdict":"Pick Gemini 4 Neon for most work at similar quality, faster and cheaper; pick Carbon only for terminal-heavy agent tasks or while its promo pricing lasts."}],"insufficient":false,"confidence":"medium","sources":[{"n":1,"title":"Introducing Gemini 4 Neon (Google)","url":"https://blog.google/innovation-and-ai/models-and-research/gemini-models/introducing-gemini-4-neon/","independent":false},{"n":2,"title":"Gemini 4 Neon in GitHub Copilot (GitHub Changelog)","url":"https://github.blog/changelog/2026-11-18-gemini-4-neon-in-github-copilot","independent":false},{"n":3,"title":"Gemini 4 Neon Beats Claude Opus 5.5, GPT 6.2 Sol On Most Benchmarks (OfficeChai, reproduces Google's benchmark table)","url":"https://officechai.com/ai/gemini-4-neon-benchmarks/","independent":false},{"n":4,"title":"Gemini 4 Neon - Artificial Analysis","url":"https://artificialanalysis.ai/models/gemini-4-neon","independent":true},{"n":5,"title":"Gemini 4 Neon vs Claude Opus 5.5 - Artificial Analysis","url":"  Models in 2026 (Plotly)","url":"https://plotly.com/blog/open-models-vs-closed-models-2026/","independent":true}],"independent_sources":3,"generated_at":"2026-11-19T02:44:18+00:00"},"genie 4":{"new":"Genie 4","category":"llm-provider-sdk","category_label":"LLM & SDK","summary":"Genie 4 is a real-time interactive world model, not an LLM. Its main draws are native audio, ~2-minute sessions and text edits mid-session; it is reaching Google AI Ultra subscribers, but it has no independent benchmarks, no published resolution or fps, and no developer pricing.","rivals":[{"name":"Genie 3","vendor":"Google DeepMind","pros":[{"text":"Genie 4 generates audio that matches the scene (ambient sound and dialogue); Genie 3 has no native audio.","sources":[1,2,5]},{"text":"Genie 4 lets you type prompts mid-session to change weather, add characters or redirect the action.","sources":[1,2]},{"text":"Genie 4 demo footage is 1080p versus 720p/24fps for Genie 3, though this comes from vendor clips, not tests.","sources":[5]}],"cons":[{"text":"Genie 3 now runs up to 3 minutes per generation, while Genie 4 is reported at about 2 minutes.","sources":[1,2]},{"text":"Only Genie 3 supports chaining worlds and seeding from 360° panoramas, and Google recommends it for longer runs.","sources":[1]},{"text":"Hacker News commenters doubt that Genie 4 improved object permanence over Genie 3's demos.","sources":[3]}],"verdict":"Pick Genie 4 for audio and live scene editing; pick Genie 3 for longer sessions, chained worlds or panorama-seeded spaces."},{"name":"Marble","vendor":"World Labs","pros":[{"text":"Genie 4 streams a live interactive world with audio, while Marble builds static 3D scenes rather than real-time video.","sources":[2,5]},{"text":"Genie 4 lets you steer the world with text while it runs, and Gemini helps fit the change into the scene.","sources":[1,2]}],"cons":[{"text":"Marble exports Gaussian splats, meshes and video for production pipelines; no export is documented for Genie 4.","sources":[5]},{"text":"Marble has a self-serve API at about $1.20 per world (1,500 credits at $1/1,250 credits), while Genie 4 has no public developer pricing.","sources":[6,8]},{"text":"Marble's 3D worlds persist, while Genie 4 changes what is behind you when you turn around and its sense of scale drifts.","sources":[4,5]}],"verdict":"Pick Genie 4 for real-time exploration with audio; pick Marble if you need persistent, exportable 3D assets with an API today."},{"name":"GWM Worlds 2","vendor":"Runway","pros":[{"text":"Genie 4 is rolling out to Google AI Ultra subscribers, while GWM Worlds 2 is a research preview you request through a contact form.","sources":[1,7]},{"text":"Genie 4 demos show 1080p versus GWM Worlds 2's published 720p at 24fps, though Genie 4's figure comes from demo footage only.","sources":[5,7]}],"cons":[{"text":"Runway says GWM Worlds 2 can generate indefinitely, while Genie 4 is capped at about 2 minutes and isn't guaranteed to stay consistent that long.","sources":[2,7]},{"text":"Runway publishes concrete specs (720p, 24fps, 48 kHz audio); Google has not published Genie 4's resolution or frame rate.","sources":[6,7]},{"text":"Google admits Genie 4 still struggles with complex physics, for example a bust that should topple settles on its plinth instead.","sources":[2]}],"verdict":"Pick Genie 4 if you have AI Ultra and want the easiest hands-on access; pick GWM Worlds 2 for unbounded sessions with published specs."},{"name":"Odyssey-3","vendor":"Odyssey","pros":[{"text":"Genie 4 generates native ambient sound, music and dialogue; Odyssey-3 has no audio.","sources":[6]},{"text":"Genie 4 offers about 2-minute sessions and natural-language edits mid-scene; Odyssey-3 publishes no session length.","sources":[6]}],"cons":[{"text":"Odyssey-3 has a free browser demo (the distilled Flash variant), while Genie 4 requires a Google AI Ultra plan.","sources":[1,6]},{"text":"Odyssey-3 publishes resolutions (832×480, or 1280×720 for Pro) and Physics-IQ scores (Pro 66.10, vendor-reported); Genie 4 publishes neither.","sources":[6]},{"text":"Hands-on users report that Genie 4 motion can feel laggy and its game logic is shallow.","sources":[4]}],"verdict":"Pick Genie 4 for audio-rich, prompt-steerable worlds; pick Odyssey-3 for free browser access and physics-focused agent or robotics work."}],"insufficient":false,"confidence":"low","sources":[{"n":1,"title":"Genie 4 is now available (Google blog / DeepMind)","url":"https://blog.google/innovation-and-ai/models-and-research/google-deepmind/genie-4-now-available-project-genie/","independent":false},{"n":2,"title":"World models become robot playgrounds (DeepLearning.AI, The Batch, Nov 6 2026)","url":"https://www.deeplearning.ai/the-batch/world-models-become-robot-playgrounds/","independent":true},{"n":3,"title":"Genie 4 discussion thread (Hacker News)","url":"https://news.ycombinator.com/item?id=50261319","independent":true},{"n":4,"title":"Google Genie 4: Hands-On With the New AI World Model (MindStudio)","url":"https://www.mindstudio.ai/blog/google-genie-4-world-model","independent":true},{"n":5,"title":"Genie 4 vs. Genie 3 vs. Marble: What the Demos Show, and What They Hide (DEV Community; based on demos, no hands-on)","url":"https://dev.to/ming_ming_11212cd04685643/genie-4-vs-genie-3-vs-marble-what-the-demos-show-and-what-they-hide-26a6","independent":true},{"n":6,"title":"Genie 4 vs Odyssey-3 (OrcaRouter blog; third-party model-routing vendor)","url":"https://www.orcarouter.ai/blog/genie-4-vs-odyssey-3","independent":true},{"n":7,"title":"Introducing GWM Worlds 2 (Runway research preview)","url":"https://runway.com/research/introducing-gwm-worlds-2","independent":false},{"n":8,"title":"World Labs API pricing (docs)","url":"https://docs.worldlabs.ai/api/pricing","independent":false}],"independent_sources":5,"generated_at":"2026-11-19T02:44:19+00:00"},"github copilot":{"new":"GitHub Copilot","category":"ai-coding-tool","category_label":"Công cụ AI lập trình","summary":"As of Nov 17, 2026, GitHub Copilot's Fusion Max ranks first on the independent Terminal-Bench 4.1 leaderboard at 71.2%, and Copilot Pro is the cheapest mainstream paid plan at $10/mo. Developers rate it below Claude Code and Cursor, though, and the token-metered credits introduced in June 2026 have drawn steady complaints about cost.","rivals":[{"name":"Claude Code","vendor":"Anthropic","pros":[{"text":"On Terminal-Bench 4.1, Copilot Fusion Max scores 71.2% (±2.9) against 65.8% for Claude Code's best entries (Opus 5.5 and Fable 5.2).","sources":[1]},{"text":"Copilot Pro costs $10/mo, compared with $20/mo for Claude Pro ($17/mo billed annually), and Pro can also delegate tasks to Claude Code as a third-party agent.","sources":[2,6]},{"text":"Copilot works in VS Code, Visual Studio, JetBrains, Vim, Neovim and Xcode, and its cloud agent can turn an issue into a PR.","sources":[4]}],"cons":[{"text":"In a 906-engineer survey, 46% named Claude Code their most-loved tool, compared with 9% for Copilot.","sources":[4]},{"text":"A hands-on reviewer found Copilot's multi-file reasoning weaker and its context smaller, so complex architecture work became back-and-forth.","sources":[4]},{"text":"Copilot's token-metered credits are hard to predict (one Pro+ user used 8% of a month's credits in two hours), while Claude plans use fixed 5-hour and weekly usage windows.","sources":[5,6]}],"verdict":"Pick GitHub Copilot if you want the cheapest seat with broad IDE coverage and the top Terminal-Bench 4.1 score; pick Claude Code if you do a lot of complex multi-file refactoring and want flat-rate usage windows."},{"name":"Codex","vendor":"OpenAI","pros":[{"text":"On Terminal-Bench 4.1, Copilot Fusion Max scores 71.2%, compared with 62.1% for Codex's best entry (GPT-6.2 Astra).","sources":[1]},{"text":"Copilot offers OpenAI's newest models: GPT-6.2 Astra and Sol became generally available in Copilot on Nov 17, the same day they were posted on the Codex leaderboard.","sources":[1,10]},{"text":"Copilot Pro is $10/mo, compared with $20/mo for ChatGPT Plus, the cheapest Codex plan that includes the CLI, IDE extension and cloud.","sources":[2,7]}],"cons":[{"text":"Codex Plus gives estimated message allowances per 5-hour window (for example 17–180 GPT-6.2 Sol messages), while Copilot users report losing credits unpredictably under token billing.","sources":[5,7]},{"text":"Fusion Max is listed only in Copilot Pro+ at $39/mo, while Codex Plus at $20/mo already includes GPT-6.1 Sol.","sources":[2,7]},{"text":"Codex Pro plans ($100 and up) currently have no 5-hour limit, while Copilot Max ($100) comes with $200 of metered credits.","sources":[2,7]}],"verdict":"Pick GitHub Copilot if you want OpenAI, Anthropic and Google models in one place for less money; pick Codex if you work mainly with OpenAI models and want predictable message-window limits."},{"name":"Cursor","vendor":"Anysphere","pros":[{"text":"Copilot Pro ($10) includes unlimited completions, a cloud agent and model selection; Cursor's cloud agents start at Premium ($30), and its $8 Plus plan offers only Grok models.","sources":[2,8]},{"text":"Copilot submitted a result to Terminal-Bench 4.1 (rank #1); Cursor is not on that leaderboard, and its score depends on whichever model you pick.","sources":[1,3]},{"text":"Copilot runs as a plugin in JetBrains, Vim, Neovim, Visual Studio and Xcode instead of making you switch to a separate editor.","sources":[4]}],"cons":[{"text":"A reviewer who used both for three months rated Cursor's autocomplete the best they had tried and ran three agents in parallel on one feature.","sources":[4]},{"text":"In the same survey, 19% of engineers named Cursor their most-loved tool, compared with 9% for Copilot.","sources":[4]},{"text":"Users have complained about how fast Copilot's token billing burns credits (one change cost more than $6), while Cursor resets usage allowances weekly and lets you set spending caps.","sources":[5,8]}],"verdict":"Pick GitHub Copilot if you want to stay in your current IDE on a $10 budget; pick Cursor if you'll switch to its editor for the best tab completion and parallel in-editor agents."},{"name":"Antigravity","vendor":"Google","pros":[{"text":"On Terminal-Bench 4.1, Copilot Fusion Max scores 71.2%, compared with 64.5% for the best Antigravity CLI entry (Gemini 4 Carbon).","sources":[1]},{"text":"Copilot holds SOC 2 Type 2, ISO 27001 and ISO 42001 certifications and contractually commits not to train on Business and Enterprise data; Antigravity has no documented SOC 2 or SLA and runs under Pre-GA terms.","sources":[9]},{"text":"Copilot Business ($19) and Enterprise ($39) seat prices are published, while Antigravity's enterprise pricing is custom through Google Cloud only.","sources":[9]}],"cons":[{"text":"Antigravity is free for individuals and Gemini CLI allows 1,000 requests/day, while Copilot Free is capped at 2,000 completions per month.","sources":[3]},{"text":"Antigravity has built-in subagent orchestration that produces a plan, task list and walkthrough, then pauses at a review step before changing code.","sources":[9]}],"verdict":"Pick GitHub Copilot if you need something your procurement team can approve today; pick Antigravity if you're an individual who wants free Gemini-powered agents and can live with preview-stage terms."}],"insufficient":false,"confidence":"medium","sources":[{"n":1,"title":"Terminal-Bench 4.1 Leaderboard (tbench.ai)","url":"https://www.tbench.ai/leaderboard","independent":true},{"n":2,"title":"GitHub Copilot plans and pricing","url":"https://github.com/features/copilot/plans","independent":false},{"n":3,"title":"Best AI Coding Agents (October 2026): Scored Leaderboard (Morph)","url":"https://www.morphllm.com/best-ai-coding-agents-2026","independent":true},{"n":4,"title":"Claude Code vs Cursor vs GitHub Copilot: An Honest Comparison After Using All Three in Production (The Vibelog)","url":"https://thevibelog.dev/blog/cursor-claude-codex-2026/","independent":true},{"n":5,"title":"GitHub Copilot users threaten exit as metered billing kicks in (The Register)","url":"https://www.theregister.com/ai-and-ml/2026/06/02/github-copilot-users-threaten-exit-as-metered-billing-kicks-in/5249826","independent":true},{"n":6,"title":"Claude pricing","url":"https://claude.com/pricing","independent":false},{"n":7,"title":"Codex / ChatGPT pricing","url":"https://learn.chatgpt.com/docs/pricing","independent":false},{"n":8,"title":"Cursor pricing","url":"https://cursor.com/pricing","independent":false},{"n":9,"title":"GitHub Copilot vs Google Antigravity (Augment Code)","url":"https://www.augmentcode.com/tools/github-copilot-vs-google-antigravity","independent":false},{"n":10,"title":"OpenAI's GPT-6.2 Astra and GPT-6.2 Sol now available (GitHub Changelog)","url":"https://github.blog/changelog/2026-11-17-openais-gpt-6-2-astra-and-gpt-6-2-sol-now-available","independent":false}],"independent_sources":4,"generated_at":"2026-11-19T02:46:02+00:00"},"openai codex":{"new":"OpenAI Codex","category":"ai-coding-tool","category_label":"Công cụ AI lập trình","summary":"OpenAI Codex is the cost and speed leader among top coding agents: in Artificial Analysis tests it costs about $5.12 and takes 25 minutes per task, against $15.47 and 53 minutes for Claude Code. On the current Terminal-Bench 4.1 leaderboard, though, its best run (62.1%) trails GitHub Copilot Fusion (71.2%), Claude Code (65.8%) and Antigravity CLI (64.5%).","rivals":[{"name":"Claude Code","vendor":"Anthropic","pros":[{"text":"Codex is about 3x cheaper and 2x faster per task: $5.12 and 25.1 min vs $15.47 and 53.3 min (GPT-6.2 Astra Max vs Fable 5.2 Xhigh).","sources":[2]},{"text":"Codex uses about half the tokens (4.67M vs 9.75M per task) and about half the turns (51 vs 94.7).","sources":[2]},{"text":"The Codex CLI is open source under Apache-2.0 while Claude Code is proprietary, and ChatGPT Plus ($20) publishes message ranges (15–160 GPT-6.1 Sol per 5h) where Anthropic publishes none.","sources":[4]}],"cons":[{"text":"Codex scores lower on Artificial Analysis: Coding Agent Index 53 vs 58, FrontierCode 42 vs 49, SWE-Atlas-QnA 55 vs 62.","sources":[2]},{"text":"On Terminal-Bench 4.1, the best Codex run (GPT-6.2 Astra, 62.1%) trails Claude Code with Opus 5.5 or Fable 5.2 (65.8%).","sources":[1]},{"text":"Hands-on users report that Codex keeps plans only in context, so they are lost on compaction, while Claude saves plans to disk.","sources":[9]}],"verdict":"Pick OpenAI Codex for cheaper, faster delegated runs; pick Claude Code when top accuracy on hard tasks matters more than cost."},{"name":"GitHub Copilot (Copilot Fusion)","vendor":"GitHub / Microsoft","pros":[{"text":"Codex is a standalone agent: an open-source Rust CLI with a sandboxed full-auto mode plus parallel cloud sandboxes. Copilot centres on IDE completion and an agent that turns GitHub issues into PRs.","sources":[6]},{"text":"Codex runs local commands under filesystem and network limits that you control, enforced on macOS, Linux and Windows.","sources":[10]}],"cons":[{"text":"Copilot Fusion Max leads Terminal-Bench 4.1 at 71.2%, against 62.1% for the best Codex run.","sources":[1,8]},{"text":"Fusion scored 51 on Artificial Analysis FrontierCode, against Codex's 42.","sources":[2,11]},{"text":"Codex only offers OpenAI models, while Copilot covers Claude, GPT, Gemini, Grok and Kimi from $10/month Pro, and Pro can even run Codex as a third-party agent.","sources":[6]}],"verdict":"Pick OpenAI Codex for a terminal- or cloud-first agent with strong local sandboxing; pick Copilot if you live in GitHub/IDE and want the current Terminal-Bench leader with multi-vendor models."},{"name":"Antigravity CLI (Gemini 4)","vendor":"Google","pros":[{"text":"Codex is cheaper and faster per task: $5.12 and 25.1 min vs $6.86 and 30.5 min.","sources":[3]},{"text":"Codex is far more efficient: 4.67M vs 13.8M tokens and 51 vs 177 turns per task.","sources":[3]}],"cons":[{"text":"Antigravity scores higher on the Artificial Analysis Coding Agent Index (59 vs 53) and SWE-Atlas-QnA (68 vs 55).","sources":[3]},{"text":"On Terminal-Bench 4.1, Antigravity with Gemini 4 Carbon scores 64.5%, against 62.1% for the best Codex run.","sources":[1]}],"verdict":"Pick OpenAI Codex for token-efficient, cheaper runs; pick Antigravity CLI if you are on Google AI Pro ($19.99) and want slightly higher agent-benchmark scores."},{"name":"Cursor","vendor":"Anysphere","pros":[{"text":"On Terminal-Bench 2.1 (an older board), Codex CLI with GPT-6 Astra scored 87.4% vs 79.3% for Cursor CLI with Grok 4.5.","sources":[5]},{"text":"Codex Plus ($20) publishes 5-hour message ranges, while Cursor Pro ($20) includes only $20 of usage and then bills on demand, which Morph says makes monthly spend hard to predict.","sources":[4,7]},{"text":"The Codex CLI is open source under Apache-2.0, while Cursor is a proprietary VS Code fork with lock-in to its release cycle.","sources":[4,7]}],"cons":[{"text":"Codex has nothing like Cursor's sub-second Tab completions for in-editor coding.","sources":[7]},{"text":"Cursor bundles parallel agents, Bugbot code review and a plugin marketplace inside the IDE.","sources":[7]}],"verdict":"Pick OpenAI Codex for terminal or cloud agent work with predictable plan limits; pick Cursor if you want an AI-first IDE with fast inline completions."}],"insufficient":false,"confidence":"medium","sources":[{"n":1,"title":"Terminal-Bench 4.1 leaderboard","url":"https://www.tbench.ai/leaderboard","independent":true},{"n":2,"title":"Artificial Analysis: Claude Code vs Codex","url":"https://artificialanalysis.ai/agents/coding-agents/comparisons/claude-code-vs-codex","independent":true},{"n":3,"title":"Artificial Analysis: Antigravity CLI vs Codex","url":"https://artificialanalysis.ai/agents/coding-agents/comparisons/antigravity-cli-vs-codex","independent":true},{"n":4,"title":"Morph: Codex vs Claude Code (November 2026)","url":"https://www.morphllm.com/comparisons/codex-vs-claude-code","independent":false},{"n":5,"title":"Snorkel: Terminal-Bench 2.1 leaderboard","url":"https://snorkel.ai/leaderboard/terminal-bench-2-1/","independent":true},{"n":6,"title":"Morph: OpenAI Codex vs GitHub Copilot in 2026","url":"https://www.morphllm.com/comparisons/codex-vs-copilot","independent":false},{"n":7,"title":"Morph: Codex vs Cursor in 2026","url":"https://morphllm.com/comparisons/codex-vs-cursor","independent":false},{"n":8,"title":"GitHub Changelog: Copilot Fusion updates (2026-11-17)","url":"https://github.blog/changelog/2026-11-17-github-copilot-fusion-updates-more-availability-benchmarks-and-models/","independent":false},{"n":9,"title":"Hacker News: A week of using Codex more than Claude","url":"https://news.ycombinator.com/item?id=49393051","independent":true},{"n":10,"title":"OpenAI: Inside the Codex sandbox","url":"https://openai.com/index/inside-the-codex-sandbox","independent":false},{"n":11,"title":"Artificial Analysis on X: Copilot Fusion results","url":"https://x.com/ArtificialAnlys/status/2115477379640664478","independent":true}],"independent_sources":6,"generated_at":"2026-11-19T02:46:35+00:00"},"gemini cli":{"new":"Gemini CLI","category":"ai-coding-tool","category_label":"Công cụ AI lập trình","summary":"Gemini CLI is still open source and still getting releases (v0.69.0 this week), but since June 18, 2026 only enterprise Code Assist licences and paid API keys can use it, because Google moved individual users to Antigravity CLI. Its last public Terminal-Bench 2.1 score (70.7% with Gemini 3.1 Pro, as of June 2026) is behind Codex CLI and Claude Code.","rivals":[{"name":"Claude Code","vendor":"Anthropic","pros":[{"text":"Gemini CLI is open source under Apache-2.0; Claude Code is proprietary with no public source.","sources":[3,4]},{"text":"Gemini CLI has a 1M-token context window and is rated the fastest of the three, using the smallest models.","sources":[4]},{"text":"Enterprise Code Assist gives fixed daily quotas (1,500 requests/day on Standard, 2,000 on Enterprise) instead of usage-limited subscription tiers.","sources":[2]}],"cons":[{"text":"On Terminal-Bench 2.1 (June 2026), Gemini CLI with Gemini 3.1 Pro scored 70.7% (#6) against 78.9% (#2) for Claude Code with Opus 4.8.","sources":[5]},{"text":"Reviewers rate Claude Code the strongest tool for multi-file changes and refactors.","sources":[4]},{"text":"Individual Google AI Pro/Ultra subscribers lost Gemini CLI access on June 18, 2026; Claude Code is included in Claude Pro and higher plans.","sources":[1,4]}],"verdict":"Pick Gemini CLI if you are an enterprise Google Cloud/Code Assist shop that needs open-source, auditable tooling; pick Claude Code for the best results on complex multi-file coding."},{"name":"Codex CLI","vendor":"OpenAI","pros":[{"text":"Gemini CLI has a full 1M-token context; Codex CLI with gpt-5.5 takes about 922K input tokens and charges 2x input and 1.5x output above 272K.","sources":[4]},{"text":"Gemini CLI is rated faster than Codex CLI in a hands-on comparison.","sources":[4]}],"cons":[{"text":"On Terminal-Bench 2.1, Gemini CLI scored 70.7% against 83.4% (#1) for Codex CLI with GPT-5.5.","sources":[5]},{"text":"Codex CLI is included in ChatGPT Free ($0), Plus ($20) and Pro (from $100); individuals can no longer use Gemini CLI at all.","sources":[1,4]},{"text":"Codex CLI comes with automatic PR review and on-demand @codex review; Gemini CLI has no equivalent highlighted.","sources":[4]}],"verdict":"Pick Gemini CLI if you need very large context inside a Google enterprise contract; pick Codex CLI for top benchmark scores, low-cost individual access and PR-review automation."},{"name":"Antigravity CLI","vendor":"Google","pros":[{"text":"Gemini CLI stays an Apache-2.0 repository; Antigravity CLI's GitHub page has only a changelog, a readme and a demo GIF.","sources":[3]},{"text":"A hands-on reviewer called Gemini CLI more mature; Antigravity CLI forgot permission grants within a session and hung in Windows terminals.","sources":[7]},{"text":"Antigravity CLI users report hitting quota after about two meaningful iterations or a handful of prompts.","sources":[3,7]}],"cons":[{"text":"Free, Google AI Pro and Ultra individual users lost Gemini CLI on June 18, 2026; Antigravity CLI is open to everyone.","sources":[1,2]},{"text":"Antigravity CLI is written in Go, which Google says makes it faster, and runs multiple agents in the background so long tasks don't block the terminal.","sources":[1]},{"text":"Google's quota page says Gemini CLI is not optimized for Gemini 4 Argon, which requires Antigravity.","sources":[2]}],"verdict":"Pick Gemini CLI if you are an enterprise or API-key user who wants a stable, open-source tool; pick Antigravity CLI if you are an individual developer or need Google's newest models and multi-agent features."},{"name":"OpenCode","vendor":"OpenCode (open-source project)","pros":[{"text":"Gemini CLI has a published Terminal-Bench 2.1 entry (70.7%); OpenCode has no fixed score because results depend on the model you plug in.","sources":[6,8]},{"text":"Enterprise customers keep Google's support for Gemini CLI, including access to the latest Gemini models.","sources":[1]}],"cons":[{"text":"Gemini CLI only runs Gemini models with no local-model option; OpenCode supports 75+ providers with your own keys, plus Ollama and LM Studio.","sources":[6]},{"text":"OpenCode had more GitHub stars in June 2026 (about 172K against 105K for Gemini CLI).","sources":[6]},{"text":"Google's move to Antigravity CLI and developers' trust complaints make Gemini CLI's long-term roadmap uncertain.","sources":[1,3]}],"verdict":"Pick Gemini CLI if you are committed to Gemini with Google enterprise support; pick OpenCode if you want an open-source agent that isn't tied to one vendor and can use any model, including local ones."}],"insufficient":false,"confidence":"medium","sources":[{"n":1,"title":"An important update: Transitioning Gemini CLI to Antigravity CLI (Google Developers Blog)","url":"https://developers.googleblog.com/en/an-important-update-transitioning-gemini-cli-to-antigravity-cli/","independent":false},{"n":2,"title":"Gemini CLI: Quotas and Pricing (official docs)","url":"https://geminicli.com/docs/resources/quota-and-pricing","independent":false},{"n":3,"title":"Bye bye Gemini CLI: Google nudges devs toward Antigravity (The Register)","url":"https://www.theregister.com/ai-ml/2026/05/20/bye-bye-gemini-cli-google-nudges-devs-toward-antigravity/5243605","independent":true},{"n":4,"title":"Codex vs Claude Code vs Gemini CLI (2026) - Tembo","url":"https://www.tembo.io/blog/codex-vs-claude-code-vs-gemini-cli","independent":true},{"n":5,"title":"Codex CLI vs Claude Code vs Gemini CLI: Terminal-Bench 2.1 (June 2026)","url":"https://andrew.ooo/answers/codex-cli-vs-claude-code-vs-gemini-cli-terminal-bench-2-1-june-2026/","independent":true},{"n":6,"title":"OpenCode vs Gemini CLI (2026) - Morph","url":"https://www.morphllm.com/comparisons/opencode-vs-gemini-cli","independent":false},{"n":7,"title":"Antigravity CLI first impressions: fast, rough, and not ready (DEV Community)","url":"https://dev.to/jagostoni/antigravity-cli-first-impressions-fast-rough-and-not-ready-522j","independent":true},{"n":8,"title":"7 CLI Coding Agents Ranked by Real Terminal-Bench Scores (SSOJet)","url":"https://ssojet.com/blog/best-cli-coding-agents-ranked","independent":true}],"independent_sources":5,"generated_at":"2026-11-19T02:46:40+00:00"},"claude agent sdk":{"new":"Claude Agent SDK","category":"agent-framework","category_label":"Framework AI agent","summary":"Claude Agent SDK (Python v0.2.185 was released on Nov 19) gives you a ready-made agent loop with built-in tools, and most reviewers rate it the strongest choice for Claude-only coding and filesystem agents. Its rivals do better on model choice, step-by-step workflows with resumable state, and token cost. Nearly all the evidence comes from vendor blogs plus one unreplicated benchmark; no independent leaderboard ranks agent frameworks.","rivals":[{"name":"OpenAI Agents SDK","vendor":"OpenAI","pros":[{"text":"It ships 8 built-in computer tools (Read, Write, Edit, Bash, Glob, Grep, WebSearch, WebFetch), while OpenAI's built-in tools are hosted web search, file search and code interpreter.","sources":[1,6]},{"text":"MCP support is first-party; OpenAI added MCP in v0.7 and needs more manual wiring.","sources":[1]},{"text":"Subagents can run in parallel under one orchestrator, while OpenAI hands work from agent to agent in sequence; automatic prompt caching (up to 90% off input on repeat turns, per Fastio) and a max_budget_usd cap help control cost.","sources":[1,2]}],"cons":[{"text":"It only runs Claude models, while OpenAI's SDK reaches 100+ models through LiteLLM.","sources":[1,2]},{"text":"It has no voice agents, while OpenAI supports Realtime Agents (gpt-realtime-1.5).","sources":[1]},{"text":"OpenAI includes guardrail decorators and dashboard tracing; Claude relies on hooks and an OpenTelemetry event stream.","sources":[1]}],"verdict":"Pick Claude Agent SDK for a single deep coding or computer-use agent on Claude; pick OpenAI Agents SDK for multi-model or voice apps and handoff-style multi-agent flows."},{"name":"LangGraph","vendor":"LangChain","pros":[{"text":"Time to a first agent is hours with the SDK's fixed loop, versus days to design a LangGraph graph.","sources":[4]},{"text":"It includes native tools, declarative subagents, lifecycle hooks and three-layer permissions out of the box.","sources":[3]},{"text":"It suits open-ended tasks where the agent works out its own path, such as research or triage.","sources":[4]}],"cons":[{"text":"In one unreplicated Opus 4.7 test (orchestrator plus 3 workers) it used 22,000 tokens, 28 s and $0.42 per run, versus 18,500 tokens, 22 s and $0.35 for LangGraph.","sources":[3]},{"text":"It has no per-step checkpoints, so a run cannot resume after a crash; LangGraph has checkpointers and can pause at any node for human approval.","sources":[4]},{"text":"You host it and wire up your own observability, while LangGraph offers its Platform, LangSmith, and works with any model.","sources":[3,4]}],"verdict":"Pick Claude Agent SDK for fast, open-ended Claude agents; pick LangGraph for long-running, multi-model workflows with a fixed shape, an audit trail and resumable state."},{"name":"Google ADK","vendor":"Google","pros":[{"text":"Composio's tests rated it best for deep OS and file access and for developer assistants (it forked a repo and opened a PR on its own).","sources":[2]},{"text":"In the same tests ADK failed most tool calls in demos and racked up a $5 bill from a tool-call loop.","sources":[2]},{"text":"It deploys to several clouds (Bedrock, Vertex AI, Azure AI Foundry), while ADK's smooth path is Google Cloud.","sources":[2]}],"cons":[{"text":"It supports Python and TypeScript only, while ADK covers Python, TypeScript, Java and Go.","sources":[2]},{"text":"It is Claude-first, while ADK is tuned for Gemini but works with other models.","sources":[2]},{"text":"ADK restores state after failures and can rewind context; Claude offers context compaction.","sources":[2]}],"verdict":"Pick Claude Agent SDK for file and shell agents on Claude across clouds; pick Google ADK for GCP or multi-language enterprise teams."},{"name":"Pydantic AI","vendor":"Pydantic","pros":[{"text":"Setup takes minutes, versus hours for Pydantic AI.","sources":[5]},{"text":"Adaptive routing mid-task may give better results on open-ended workflows.","sources":[5]},{"text":"You get new Claude features early.","sources":[5]}],"cons":[{"text":"It only runs Claude, while Pydantic AI switches between Anthropic, OpenAI, Gemini, Groq and Mistral with one line.","sources":[5]},{"text":"Tool schemas are resent on every call, adding 200–800 tokens per call, and orchestrator calls carry the full history.","sources":[5]},{"text":"There is no built-in type validation, and the bundled CLI subprocess adds cold-start latency on serverless.","sources":[5,6]}],"verdict":"Pick Claude Agent SDK for prototypes and open-ended Claude agents; pick Pydantic AI for typed, multi-model production at scale."},{"name":"CrewAI","vendor":"CrewAI","pros":[{"text":"In one unreplicated test it used 22,000 tokens versus 41,000, cost $0.42 versus $0.78 per run, and took 28 s versus 34 s.","sources":[3]},{"text":"At 10,000 runs a month that projects to $4,200 versus $7,800.","sources":[3]},{"text":"Built-in tools, hooks and permission layers make it strong for filesystem and coding agents.","sources":[3]}],"cons":[{"text":"CrewAI starts in about 20 lines and has a large community.","sources":[3]},{"text":"It is locked to Claude, while CrewAI works with any model.","sources":[3]},{"text":"It has had billing changes since June 15, 2026, and branding rules restrict white-label products.","sources":[3]}],"verdict":"Pick Claude Agent SDK for token-efficient coding agents on Claude; pick CrewAI for quick, model-agnostic role-based multi-agent prototypes."}],"insufficient":false,"confidence":"low","sources":[{"n":1,"title":"Claude Agent SDK vs OpenAI Agents SDK: A Developer's Comparison (Fastio)","url":"https://fast.io/resources/claude-agent-sdk-vs-openai-agents-sdk/","independent":false},{"n":2,"title":"Claude Agents SDK vs. OpenAI Agents SDK vs. Google ADK (Composio)","url":"https://composio.dev/content/claude-agents-sdk-vs-openai-agents-sdk-vs-google-adk","independent":false},{"n":3,"title":"Claude Agent SDK vs LangGraph vs CrewAI: Benchmark 2026 (Pasquale Pillitteri)","url":"https://pasqualepillitteri.it/en/news/3095/claude-agent-sdk-vs-langgraph-vs-crewai-benchmark-2026-en","independent":true},{"n":4,"title":"Claude Agent SDK vs LangGraph (TrueFoundry)","url":"https://www.truefoundry.com/blog/claude-agent-sdk-vs-langgraph","independent":false},{"n":5,"title":"Agent SDK vs Framework: Claude Agent SDK vs Pydantic AI for Production (MindStudio)","url":"https://www.mindstudio.ai/blog/agent-sdk-vs-framework-claude-pydantic-ai-production-2","independent":false},{"n":6,"title" // ---------------------------------------------------------------- state & utils

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch { /* private mode: not remembered */ } },
};
const prefersDark = () => { try { return matchMedia("(prefers-color-scheme: dark)").matches; } catch { return false; } };
const emptyAnswers = () => ({ role: "", skills: "", project: "", interests: "" });

const state = {
  lang: "vi", theme: store.get("ss-theme") || (prefersDark() ? "dark" : "light"),
  meta: null, profile: null, view: "loading", tab: "radar", step: 0, answers: emptyAnswers(),
  draft: null, editing: false, busy: null, addPreview: null, importPreview: null,
  confirmReset: false, confirmSourceReset: false, sources: null, notifyCfg: null, notifyOpen: null, chats: null,
  radar: null, reports: null, report: null, pollTimer: null, filter: "all",
  compares: {}, menuOpen: null, drawer: null, auto: null, autoTimer: null, skillFilter: "all", market: {},
};

function t(key, params = {}) {
  const raw = (I18N[state.lang] && I18N[state.lang][key]) ?? I18N.vi[key] ?? key;
  return raw.replace(/\{(\w+)\}/g, (_, k) => (params[k] ?? `{${k}}`));
}

function applyTheme() { document.documentElement.dataset.theme = state.theme; }
function applyLang() {
  document.documentElement.lang = state.lang;

function demoApi(method, path, body) {
  const D = DEMO, p = path.split("?")[0];
  const routes = {
    "/api/meta": D.meta, "/api/profile": { profile: D.profile }, "/api/settings": { language: "en", chosen: false },
    "/api/radar/status": { running: false, step: "", error: null, week: D.report.week }, "/api/reports": { weeks: [D.report.week] },
    [`/api/reports/${D.report.week}`]: D.report, "/api/compare": { comparisons: D.comparisons }, "/api/market": { market: D.market },
    "/api/sources": D.sources, "/api/notify": demoNotify(D),
  };
  if (method === "GET" && p in routes) return structuredClone(routes[p]);
  if (p === "/api/compare/auto") return { running: false, week: D.report.week, total: 0, done: 0, active: [], failed: {} };
  if (method === "PUT" && p === "/api/settings") return body;  // switching language works in the demo
  if (p === "/api/client-log") return {};
  throw new ApiError(t("demo.readonly"));
}

async function api(method, path, body) {
  if (DEMO) return demoApi(method, path, body);
  let res;
  try {
    res = await fetch(path, { method, headers: body ? { "Content-Type": "application/json" } : {},
                              body: body ? JSON.stringify(body) : undefined });
  } catch {
    throw new ApiError(t("err.network", { host: location.host }));
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    if (res.status === 502) throw new ApiError(t("err.ai"));
    const d = data.detail;
    const msg = typeof d === "string" ? d : Array.isArray(d) ? d.map(x => x.msg).join("; ") : t("err.generic");
    throw new ApiError(msg);
  }
  return data;
}

function reportError(message, detail = "") {
  console.error("[StackScout]", message, detail);
  if (DEMO) return;
  fetch("/api/client-log", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message: String(message).slice(0, 2000), detail: String(detail).slice(0, 8000) }) }).catch(() => {});
}

});

    action && h("button", { onclick: () => { el.remove(); action.run(); } }, action.label));

  if (/releases\.atom$/.test(s.url || "")) return t("kind.release");
  return t({ rss: "kind.rss", hackernews: "kind.hn", github_new_repos: "kind.github", sitemap: "kind.web" }[s.type] || "kind.rss");
}

const AI_GROUP_FROM_VI = { "Model mới": "models", "Công cụ AI lập trình": "coding", "Agent & framework": "agents" };
const sectionLists = rep => ({
  ai: rep.ai_news || [], stack: rep.stack || rep.compare_more || [], updates: rep.updates || [],
  other: rep.other_ecosystem || [], new: rep.new_areas || [], themes: rep.themes || [],
});

async function loadReports(week) {
  await run(null, async () => {
    const { weeks } = await api("GET", "/api/reports");
    state.reports = weeks;
    const pick = week && weeks.includes(week) ? week : weeks[0];
    state.report = pick ? await api("GET", `/api/reports/${encodeURIComponent(pick)}`) : null;
    state.compares = {}; state.market = {};
    if (state.report) {
      const { comparisons } = await api("GET", `/api/compare?week=${encodeURIComponent(state.report.week)}`);
      mergeComparisons(comparisons);
      mergeMarket((await api("GET", `/api/market?week=${encodeURIComponent(state.report.week)}`)).market);
    }
  });
  ensureAuto();
}

// Several cached comparisons for one item: show the one against its natural
// rival, unless the reader picked another tool with ⋯ (that one stays).
function mergeComparisons(comparisons) {
  const lists = sectionLists(state.report);
  const rivalsOf = Object.fromEntries([...lists.ai, ...lists.stack, ...lists.other, ...lists.new]
    .map(it => [nameKey(it.name), (it.rivals || []).map(nameKey)]));
  for (const [key, c] of Object.entries(comparisons)) {
    const [name, against] = key.split("|");
    const cur = state.compares[name];
    if (cur?.manual) continue;
    const isRival = (rivalsOf[name] || []).includes(against);
    if (!cur || cur.status !== "done" || isRival) state.compares[name] = { status: "done", data: c, against: c.current };
  }
}

function mergeMarket(market) {
  for (const [name, c] of Object.entries(market || {})) {
    if (state.market[name]?.status !== "done") state.market[name] = { status: "done", data: c };
  }
}

// ---- "Model & AI mới": a new model or tool vs its 3-5 strongest rivals.
// Usually ready (the automatic run does it after the radar); a click on one
// that is not done yet starts it now (the server never runs it twice).
async function marketItem(item) {
  const k = nameKey(item.name);
  state.market[k] = { status: "loading" }; render();
  try {
    const { comparison } = await api("POST", "/api/market", { week: state.report.week, name: item.name });
    state.market[k] = { status: "done", data: comparison };
  } catch (e) {
    state.market[k] = { status: "error", error: e.message };
  }
  render();
}

function marketStatus(item) {
  const m = state.market[nameKey(item.name)];
  if (m) return m.status;
  const a = state.auto, key = "market|" + nameKey(item.name);
  if (!a || a.week !== state.report?.week) return null;
  if ((a.active || []).includes(key)) return "active";
  if ((a.failed || {})[key]) return "failed";
  return a.running ? "queued" : null;
}

function openMarket(item) {
  state.menuOpen = null;
  state.drawer = { item, kind: "market", opener: document.activeElement };
  const st = marketStatus(item);
  if (st !== "done" && st !== "loading" && st !== "active") marketItem(item); else render();
}

  clearTimeout(state.autoTimer);
  state.autoTimer = setTimeout(async () => {
    const week = state.report?.week;
    try {
      state.auto = await api("GET", "/api/compare/auto");
      if (week && state.auto.week === week) {

  const MODEL_CATS = ["llm-provider-sdk", "local-llm-inference"];
  for (const item of [...L.stack, ...L.ai].filter(b => !MODEL_CATS.includes(b.category))) {
    const rival = firstRival(item);
    if (!rival) continue;
    const k = nameKey(rival);
    if (!groups.has(k)) groups.set(k, { key: k, skill: skills.find(s => nameKey(s.name) === k) || { name: rival }, items: [] });
    groups.get(k).items.push(item);
  }
  return [...groups.values()].sort((a, b) => b.items.length - a.items.length);
}

function compareAside(groups) {
  const total = groups.reduce((n, g) => n + g.items.length, 0);
  const button = (id, label, count) => h("button", { "aria-pressed": String(state.skillFilter === id),
    onclick: () => { state.skillFilter = id; render(); } }, h("span", {}, label), h("span", { class: "count" }, count));
  return h("aside", { class: "side" },
    h("section", { class: "card tight", "aria-label": t("ctab.skills") },
      h("p", { class: "sidelabel" }, t("ctab.skills")),
      h("div", { class: "filters" }, button("all", t("ctab.allSkills"), total),
        groups.map(g => button(g.key, g.skill.name, g.items.length)))),
    h("p", { class: "muted", style: "margin:0 4px;font-size:13px" }, t("ctab.hint")));
}

function compareTab() {
  const rep = state.report;
  if (!state.reports) return h("main", { class: "content single" }, h("div", { class: "card" }, loading(t("common.loading"))));
  if (!rep) return h("main", { class: "content single" }, h("div", { class: "card" }, h("p", { class: "muted", style: "margin:0" }, t("radar.empty"))));
  const [y, w] = rep.week.split("-W");
  const groups = compareGroups(rep);
  if (!groups.some(g => g.key === state.skillFilter)) state.skillFilter = "all";
  const shown = groups.filter(g => state.skillFilter === "all" || g.key === state.skillFilter);
  const a = state.auto;
  const progress = a?.running && a.week === rep.week && h("div", { class: "card tight" },
    h("div", { class: "loading" }, h("div", { class: "spinner" }), h("span", {}, t("ctab.progress", { done: a.done, total: a.total }))));
  const head = h("section", {},
    h("p", { class: "kicker" }, t("radar.week", { w: +w, y })),
    h("h1", { class: "page" }, t("ctab.title")));
  const body = groups.length
    ? shown.map(g => h("section", { class: "card" },
        h("div", { class: "sechead" }, h("span", { class: "ico" }, svg(ICON.layers)),
          h("h2", {}, g.skill.name), g.skill.level && levelBadge(g.skill.level),
          h("span", { class: "note" }, [g.skill.category && catLabel(g.skill.category), t("ctab.count", { n: g.items.length })].filter(Boolean).join(" · "))),
        g.items.map(item => itemArticle(item, { compare: true }))))
    : h("div", { class: "card" }, h("p", { class: "muted", style: "margin:0" }, t("ctab.empty")));
  return h("div", { class: "layout" }, compareAside(groups), h("main", { class: "content" }, head, progress, body));
}

// ---------------------------------------------------------------- render

function render() {
  applyLang();
  let body;
  if (state.view === "loading") body = h("div", { class: "card" }, loading(t("common.loading")));
  else if (state.view === "wizard") body = h("main", { class: "content single" }, wizardView());
  else if (state.view === "review") body = h("main", { class: "content single" }, reviewView());
  else if (state.tab === "radar") body = radarTab();
  else if (state.tab === "compare") body = compareTab();
  else if (state.tab === "notify") body = h("main", { class: "content single" }, notifyTab());
  else body = h("main", { class: "content single" }, state.tab === "sources" ? sourcesTab() : profileTab());
  document.getElementById("app").replaceChildren(...headerView().filter(Boolean), body, ...(state.drawer ? drawerView() : []));
  document.body.style.overflow = state.drawer ? "hidden" : "";
  const focusTarget = document.querySelector("[data-autofocus]");
  if (focusTarget && !focusTarget.contains(document.activeElement)) focusTarget.focus();
}

document.addEventListener("click", e => {
  if (state.menuOpen && !e.target.closest(".split")) { state.menuOpen = null; render(); }
});
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (state.menuOpen) { state.menuOpen = null; render(); }
  else if (state.drawer) closeDrawer();
});

(async function init() {
  applyTheme();
  try {
    const [meta, { profile }, radar, settings] = await Promise.all(
      [api("GET", "/api/meta"), api("GET", "/api/profile"), api("GET", "/api/radar/status"), api("GET", "/api/settings")]);
    state.meta = meta; state.profile = profile; state.radar = radar;
    const saved = store.get("ss-lang");
    // Never picked: propose the browser's language and remember it on the server,
    // so AI-written content and the digests use it too.
    const browser = (navigator.languages || [navigator.language || ""]).map(l => String(l).split("-")[0].toLowerCase())
      .find(l => meta.languages.includes(l));
    state.lang = meta.languages.includes(saved) ? saved : settings.chosen ? settings.language : (browser || settings.language);
    if (!settings.chosen && state.lang !== settings.language) api("PUT", "/api/settings", { language: state.lang }).catch(() => {});
    state.view = profile ? "main" : "wizard";
    if (profile) { loadReports(); if (radar.running) pollRadar(); }
  } catch (e) {
    toast(e.message, { error: true });
  }
  render();
})();
</script>
</body>
</html>

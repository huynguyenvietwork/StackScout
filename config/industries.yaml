      - { id: hashicorp, name: HashiCorp Blog, type: rss, url: "https://www.hashicorp.com/blog/feed.xml", tier: stack, official: true, match: { keywords: [terraform, vault, consul, nomad, packer, hashicorp] } }
      - { id: grafana, name: Grafana Labs Blog, type: rss, url: "https://grafana.com/blog/index.xml", tier: stack, official: true, match: { keywords: [grafana, prometheus, loki, k6] } }

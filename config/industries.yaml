      - { id: martin-fowler, name: Martin Fowler, type: rss, url: "https://martinfowler.com/feed.atom", tier: extra }
      - { id: bens-bites, name: "Ben's Bites", type: rss, url: "https://www.bensbites.com/feed", tier: extra }
      - { id: interconnects, name: Interconnects (Nathan Lambert), type: rss, url: "https://www.interconnects.ai/feed", tier: extra }
      - { id: nvidia-dev, name: NVIDIA Technical Blog, type: rss, url: "https://developer.nvidia.com/blog/feed", tier: extra, official: true }
      - { id: yt-fireship, name: Fireship (YouTube), type: rss, url: "https://www.youtube.com/feeds/videos.xml?channel_id=UCsBjURrPoezykLs9EqgamOA", tier: extra, limit: 5 }
      - { id: yt-matthew-berman, name: Matthew Berman (YouTube), type: rss, url: "https://www.youtube.com/feeds/videos.xml?channel_id=UCawZsQWqfGSbCI5yjkdVkTA", tier: extra, limit: 5 }
      - { id: google-ai-blog, name: Google AI Blog, type: rss, url: "https://blog.google/technology/ai/rss/", tier: extra, official: true }
      - { id: google-research, name: Google Research, type: rss, url: "https://research.google/blog/rss/", tier: extra, official: true }
      - { id: meta-engineering, name: Meta Engineering, type: rss, url: "https://engineering.fb.com/feed/", tier: extra, official: true }
